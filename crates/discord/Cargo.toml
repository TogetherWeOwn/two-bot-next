[package]
name = "two-bot-discord"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Explicit version on the intra-workspace dep (see crates/bot/Cargo.toml):
# cargo-deny `wildcards = "deny"` rejects version-less deps.
[dependencies]
two-bot-core = { version = "0.1.0", path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
twilight-cache-inmemory = { workspace = true }
twilight-gateway = { workspace = true }
twilight-model = { workspace = true }

# S2 prototype only: mock Discord double + measurement driver live in
# tests/s2_prototype.rs. Nothing here ships in the release binary.
[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio-websockets = { workspace = true }
twilight-gateway = { workspace = true }
twilight-http = { workspace = true }
twilight-model = { workspace = true }

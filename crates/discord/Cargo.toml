[package]
name = "two-bot-discord"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Explicit version on the intra-workspace dep (see crates/bot/Cargo.toml):
# cargo-deny `wildcards = "deny"` rejects version-less deps.
[dependencies]
two-bot-core = { version = "0.2.0", path = "../core" }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "http2",
    "ring",
    "rustls-platform-verifier",
] }
hyper-util = { version = "0.1", default-features = false, features = [
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
twilight-cache-inmemory = { workspace = true }
twilight-gateway = { workspace = true }
twilight-http = { workspace = true }
twilight-model = { workspace = true }

time = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[features]
default = []
db = ["two-bot-core/db", "dep:sqlx", "dep:time"]

# S2 prototype only: mock Discord double + measurement driver live in
# tests/s2_prototype.rs. Nothing here ships in the release binary.
[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio-websockets = { workspace = true }
twilight-gateway = { workspace = true }
twilight-http = { workspace = true }
twilight-model = { workspace = true }

[package]
name = "two-bot-discord"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Explicit version on the intra-workspace dep (see crates/bot/Cargo.toml):
# cargo-deny `wildcards = "deny"` rejects version-less deps.
[dependencies]
two-bot-core = { version = "0.2.0", path = "../core" }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { version = "1", default-features = false }
hyper-rustls = { workspace = true, features = ["http2", "rustls-platform-verifier"] }
hyper-util = { workspace = true, features = ["http2"] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true, optional = true }
twilight-cache-inmemory = { workspace = true }
twilight-gateway = { workspace = true }
twilight-http = { workspace = true }
twilight-model = { workspace = true }

[features]
default = []
db = ["two-bot-core/db", "dep:sqlx"]
# Explicit service-DB acceptance lane; no credentialed Discord traffic.
db-tests = ["db"]

# Local Discord doubles and measurement drivers only; none ship in release.
[dev-dependencies]
sqlx = { workspace = true }
two-bot-testsupport = { path = "../testsupport", version = "0.2.0" }
futures-util = { workspace = true, features = ["sink"] }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio-websockets = { workspace = true }
tracing-subscriber = { workspace = true }
twilight-gateway = { workspace = true }
twilight-model = { workspace = true }

[package]
name = "two-bot-core"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
# Lavalink session WebSocket (music_node.rs): the `client` flip adds no new
# crates (base64/http/httparse + tokio net/io-util are already locked).
tokio-websockets = { workspace = true, features = ["client"] }
tower-service = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
# Row-by-row dump streaming only (TryStreamExt::try_next); same locked
# version the bot and discord crates already use.
futures-util = { workspace = true }
roxmltree = "=0.21.1"

# Database access lives behind the `db` feature so unit tests for pure
# domain logic never need a Postgres driver or a live database.
sqlx = { workspace = true, optional = true }

[features]
default = []
db = ["dep:sqlx"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# Mock Lavalink session server (music_node.rs tests): `server` unions with
# the `client` feature above for test builds only.
tokio-websockets = { workspace = true, features = ["server"] }
futures-util = { workspace = true, features = ["sink"] }
two-bot-testsupport = { path = "../testsupport", version = "0.4.0" }
# Pure, bounded properties: no fork/timeout helpers or temporary-file dependency.
proptest = { version = "1.11", default-features = false, features = ["std"] }
rand = { workspace = true }
axum = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

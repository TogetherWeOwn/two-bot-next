[package]
name = "two-bot-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
regex = { workspace = true }
url = { workspace = true }

# Database access lives behind the `db` feature so unit tests for pure
# domain logic never need a Postgres driver or a live database.
sqlx = { workspace = true, optional = true }

[features]
default = []
db = ["dep:sqlx"]

[dev-dependencies]
rand = { workspace = true }
tokio = { workspace = true }

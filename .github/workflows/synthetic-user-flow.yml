name: synthetic-user-flow

# Five-minute synthetic on the main user flow (docs/synthetic-user-flow.md):
# the staging health-contract probe plus a passive production probe, each
# read-only GETs against its own Worker origin. A probe failure posts one
# Discord ops-channel alert reusing the Worker alert pattern (build revision
# plus the GitHub run link), then fails the job. Production is passive only:
# the prod job observes and alerts, it never blocks a deploy.
#
# When it runs: every 5 minutes on main, plus manual dispatch. The dispatch
# `force_fail` input proves the failure-to-alert path without touching prod:
# it points the staging probe at an unallowlisted origin so the fence refuses
# (exit 2), the upload tolerates the missing receipt, and the alert posts with
# unknown build identity plus the run link.
#
# Operator bindings (never in this file): repo vars STAGING_WORKER_URL and
# PROD_WORKER_URL carry the two Worker origins, and the `synthetic-alerts`
# environment secret SYNTHETIC_ALERT_WEBHOOK_URL carries the Discord webhook.
# A green probe needs no secret; a failed probe with no webhook fails the
# alert step so a silent alert path cannot read as delivered.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: Prove the failure-to-alert path (staging fence refusal, then alert)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: synthetic-user-flow
  cancel-in-progress: false

jobs:
  staging:
    name: staging user-flow synthetic
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    environment: synthetic-alerts
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'staging') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run the staging user-flow probe
        env:
          STAGING_WORKER_URL: ${{ (inputs.force_fail && 'https://example.invalid') || vars.STAGING_WORKER_URL }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/staging_health_contract_probe.py --evidence "synthetic-staging-$RUN_ID.json"
      - name: Upload the staging evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-staging-${{ github.run_id }}
          path: synthetic-staging-${{ github.run_id }}.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Alert the ops channel on failure
        if: failure()
        env:
          SYNTHETIC_ALERT_WEBHOOK_URL: ${{ secrets.SYNTHETIC_ALERT_WEBHOOK_URL }}
          RUN_ID: ${{ github.run_id }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SYNTHETIC_ALERT_WEBHOOK_URL:-}" ]; then
            echo "::error::SYNTHETIC_ALERT_WEBHOOK_URL missing in the synthetic-alerts environment; the staging failure cannot alert"
            exit 1
          fi
          python3 scripts/synthetic_alert.py --env staging --evidence "synthetic-staging-$RUN_ID.json"
  prod-passive:
    name: prod passive user-flow synthetic
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    environment: synthetic-alerts
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'prod-passive') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run the passive production probe
        env:
          PROD_WORKER_URL: ${{ vars.PROD_WORKER_URL }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/prod_passive_probe.py --evidence "synthetic-prod-$RUN_ID.json"
      - name: Upload the prod evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-prod-${{ github.run_id }}
          path: synthetic-prod-${{ github.run_id }}.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Alert the ops channel on failure
        if: failure()
        env:
          SYNTHETIC_ALERT_WEBHOOK_URL: ${{ secrets.SYNTHETIC_ALERT_WEBHOOK_URL }}
          RUN_ID: ${{ github.run_id }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SYNTHETIC_ALERT_WEBHOOK_URL:-}" ]; then
            echo "::error::SYNTHETIC_ALERT_WEBHOOK_URL missing in the synthetic-alerts environment; the prod failure cannot alert"
            exit 1
          fi
          python3 scripts/synthetic_alert.py --env prod --evidence "synthetic-prod-$RUN_ID.json"

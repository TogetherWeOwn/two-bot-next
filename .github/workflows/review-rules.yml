name: review-rules (shadow)
# ci-policy: non-required -- advisory signals; existing required gates stay unchanged.
# Pinned to the published TogetherWeOwn/.github release commit.
on:
  pull_request:
  merge_group:
permissions: {}
concurrency:
  group: review-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review-rules:
    permissions:
      contents: read
    uses: TogetherWeOwn/.github/.github/workflows/review-rules.yml@8059ac2b121b63443db656b1e10e927b8af8133c # v0.12.1
    with:
      packs: rust,security,python-shell-ci
      mode: warn

name: slow-burn-tracker

# Creator-join slow-burn card filer (runbook: docs/runbook.md#alert-voice-join-slow-burn).
# The `voice_join_slow_burn` Worker rule only alerts; this workflow turns the
# first firing into one GitHub tracking issue (`slow-burn` label, one open
# card per firing key), refreshes it at most every six hours while the burn
# continues, and closes it when the burn clears. An unknown verdict never
# closes an open card.
#
# How it works: every five minutes the tracker scrapes staging /ops/metrics
# with the environment bearer, appends the snapshot to the cached burn ring
# and asks the checked-in evaluator (wrangler/scripts/slow-burn-decide.mjs,
# zero edits to the rule file) whether the slow ticket fires. The five-minute
# cadence is load-bearing: the slow long-window baseline sits one long window
# behind the previous scrape, so a coarser cadence prunes its own baseline.
#
# Bindings: the `slow-burn-tracker` environment holds the secret
# METRICS_SCRAPE_TOKEN (the same bearer the Worker serves /ops/metrics with;
# unset or short server-side reads 404). STAGING_WORKER_URL is the existing
# repo variable. Without either binding the run warns and exits green: an
# unconfigured tracker must not read as a clean bill of burn health.
# Issue writes use the job GITHUB_TOKEN (contents:read plus issues:write).
#
# Proof: dispatch with fixture fire (or clear) to run the now-anchored burn
# fixture through the real evaluator and the real issue calls under the
# `slow-burn-test` label; nothing is scraped and the cache ring is untouched.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      fixture:
        description: Live scrape or a now-anchored burn fixture (proof runs only)
        type: choice
        options: [live, fire, clear]
        default: live
      dry_run:
        description: Decide and print without any issue write
        type: boolean
        default: false

permissions: {}

concurrency:
  group: slow-burn-tracker
  cancel-in-progress: false

jobs:
  tracker:
    name: slow-burn tracker
    permissions:
      contents: read
      issues: write
    if: github.ref == 'refs/heads/main'
    environment: slow-burn-tracker
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'tracker') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Restore the burn ring
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: slow-burn-ring.json
          key: slow-burn-ring-v1-${{ github.run_id }}
          restore-keys: |
            slow-burn-ring-v1-
      - name: Run the slow-burn tracker
        id: track
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          METRICS_SCRAPE_TOKEN: ${{ secrets.METRICS_SCRAPE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RING_PATH: slow-burn-ring.json
          TRACKER_FIXTURE: ${{ github.event.inputs.fixture || 'live' }}
          TRACKER_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          fixture="$TRACKER_FIXTURE"
          args=(--ring "$RING_PATH" --evidence-out slow-burn-tracker-evidence.json --exposition-out slow-burn-exposition.prom)
          if [ "$fixture" != "live" ]; then
            args+=(--fixture "$fixture" --label slow-burn-test --title-prefix '[slow-burn-test]')
          fi
          if [ "$TRACKER_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/slow_burn_tracker.py "${args[@]}"
          echo "fixture=$fixture" >> "$GITHUB_OUTPUT"
      - name: Save the burn ring
        if: ${{ !cancelled() && steps.track.outputs.fixture != 'fire' && steps.track.outputs.fixture != 'clear' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: slow-burn-ring.json
          key: slow-burn-ring-v1-${{ github.run_id }}
          restore-keys: |
            slow-burn-ring-v1-
      - name: Upload the tracker evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slow-burn-tracker-${{ github.run_id }}
          path: |
            slow-burn-tracker-evidence.json
            slow-burn-exposition.prom
          retention-days: 14

name: deploy-production-interrupted

# The protected caller holds deploy-production through every job.
on:
  workflow_call:
    inputs:
      origin-run-id: {type: string, required: true}

permissions: {}

env:
  RELEASE_RECOVERY_RUN_ID: ${{ inputs.origin-run-id }}

jobs:
  admit:
    name: Verify the original stopped writer
    if: github.repository_id == '1396224242' && github.ref == 'refs/heads/main' && github.ref_protected && github.run_attempt == 1 && github.event_name == 'workflow_dispatch' && github.workflow_ref == 'TogetherWeOwn/two-bot-next/.github/workflows/deploy-production.yml@refs/heads/main' && vars.PRODUCTION_AUTO_PROMOTE_DISABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: {name: production, deployment: false}
    permissions: &read_permissions {contents: read, actions: read, checks: read}
    outputs:
      artifact-id: ${{ steps.admission.outputs.artifact-id }}
      archive-sha256: ${{ steps.admission.outputs.artifact-digest }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false, fetch-depth: 1}
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, package-manager-cache: false}
      - name: Authenticate the interrupted origin and observe the exact pair
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_WORKER_URL: ${{ vars.PRODUCTION_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.PRODUCTION_OWNERSHIP_CONTROL_TOKEN }}
        run: python3 scripts/production_release_interrupted.py admit
      - name: Retain the authenticated interrupted admission
        id: admission
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release-interrupted-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interrupted-production-release/production-release-interrupted-admission.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  database:
    name: Classify both ledgers and finish the protected inverse
    needs: admit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-migrate-apply
    permissions: *read_permissions
    outputs:
      decision-id: ${{ steps.decision.outputs.artifact-id }}
      decision-sha256: ${{ steps.decision.outputs.artifact-digest }}
      inverse-id: ${{ steps.inverse.outputs.artifact-id }}
      inverse-sha256: ${{ steps.inverse.outputs.artifact-digest }}
    steps:
      - *checkout
      - name: Build the locked recovery runner from the trusted workflow commit
        run: cargo build -p two-bot-cutover --bin staging-migrate --locked
      - name: Classify the interrupted database state under lock
        id: classify
        env: &database
          GH_TOKEN: ${{ github.token }}
          ADMISSION_ARTIFACT_ID: ${{ needs.admit.outputs.artifact-id }}
          ADMISSION_ARCHIVE_SHA256: ${{ needs.admit.outputs.archive-sha256 }}
          TWO_BOT_PRODUCTION_MIGRATOR_DATABASE_URL: ${{ secrets.TWO_BOT_PRODUCTION_MIGRATOR_DATABASE_URL }}
        run: python3 scripts/production_release_interrupted.py classify "$GITHUB_WORKSPACE/target/debug/staging-migrate"
      - name: Retain the locked database classification
        id: decision
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release-interrupted-classification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interrupted-production-release/production-release-interrupted-classification.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Run the exact protected inverse for POST
        if: steps.classify.outputs.state == 'post'
        env: *database
        run: python3 scripts/production_release_interrupted.py inverse "$GITHUB_WORKSPACE/target/debug/staging-migrate"
      - name: Retain the verified interrupted inverse
        id: inverse
        if: steps.classify.outputs.state == 'post'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release-interrupted-inverse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interrupted-production-release/production-release-interrupted-inverse.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  restart:
    name: Restart only the confirmed prior pair
    needs: [admit, database]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions: *read_permissions
    steps:
      - *checkout
      - *node
      - name: Authenticate database evidence and confirm stable predecessor readiness
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_APPROVE: ${{ vars.PRODUCTION_AUTO_APPROVE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_WORKER_URL: ${{ vars.PRODUCTION_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.PRODUCTION_OWNERSHIP_CONTROL_TOKEN }}
          ADMISSION_ARTIFACT_ID: ${{ needs.admit.outputs.artifact-id }}
          ADMISSION_ARCHIVE_SHA256: ${{ needs.admit.outputs.archive-sha256 }}
          DECISION_ARTIFACT_ID: ${{ needs.database.outputs.decision-id }}
          DECISION_ARCHIVE_SHA256: ${{ needs.database.outputs.decision-sha256 }}
          INVERSE_ARTIFACT_ID: ${{ needs.database.outputs.inverse-id }}
          INVERSE_ARCHIVE_SHA256: ${{ needs.database.outputs.inverse-sha256 }}
        run: python3 scripts/production_release_interrupted.py restart
      - name: Retain the exact restarted pair and stable readiness
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release-interrupted-restored-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interrupted-production-release/production-release-interrupted-restored.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

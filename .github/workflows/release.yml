name: release

# SBOM chain for the daily digest releases (docs/releases.md). The
# daily-digest workflow dispatches this with the digest tag it just cut, as
# its own run, so the digest run never waits for the SBOM chain. No tagging
# happens here: per-promote vX.Y.Z tagging is retired, and versions come from
# the digest tags alone.
# Dispatch inputs: `release_tag` attaches SBOM assets to a digest release (or
# repairs a pre-digest vX.Y.Z release); `dry_run` keeps the SBOM dry-run path.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and scan SBOMs without asset publication
        type: boolean
        default: false
      release_tag:
        description: Digest release to attach SBOM assets (vYYYY.MDD.P, or a legacy vYYYY.MM.DD / vX.Y.Z tag for repair)
        type: string
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  sbom-target:
    if: ${{ !cancelled() && (inputs.dry_run == true || inputs.release_tag != '') }}
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'sbom-target') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select immutable SBOM source (dry-run never publishes)
        id: target
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release-sbom-target.py

  release-sbom:
    needs: sbom-target
    if: ${{ !cancelled() && needs.sbom-target.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/sbom.yml # zizmor: ignore[self-repository] same-repo reusable call, pinned by test_workflows
    with:
      ref: ${{ needs.sbom-target.outputs.ref }}

  attach-sbom:
    needs: [sbom-target, release-sbom]
    if: ${{ !cancelled() && needs.release-sbom.result == 'success' && needs.sbom-target.outputs.tag != '' }}
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'attach-sbom') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: supply-chain
          path: sbom
      - name: Attach verified inventories to the published tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.sbom-target.outputs.tag }}
          EXPECTED_SHA: ${{ needs.sbom-target.outputs.ref }}
        run: |
          set -euo pipefail
          (cd sbom && sha256sum --check SHA256SUMS)
          python3 scripts/release-sbom-target.py --verify-source sbom/source-sha.txt
          gh release upload "$RELEASE_TAG" sbom/*.cdx.json sbom/SHA256SUMS sbom/source-sha.txt sbom/image-id.txt --clobber

  verdict:
    name: release verdict (fail closed on empty dispatch)
    needs: [sbom-target, release-sbom, attach-sbom]
    # A skipped or failed dependency must not read as green.
    if: ${{ always() }}
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'verdict') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail closed when the dispatch selected no release path
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SBOM_TARGET_RESULT: ${{ needs.sbom-target.result }}
          RELEASE_SBOM_RESULT: ${{ needs.release-sbom.result }}
          ATTACH_SBOM_RESULT: ${{ needs.attach-sbom.result }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          results = {
              "sbom-target": os.environ.get("SBOM_TARGET_RESULT", ""),
              "release-sbom": os.environ.get("RELEASE_SBOM_RESULT", ""),
              "attach-sbom": os.environ.get("ATTACH_SBOM_RESULT", ""),
          }
          failures = []

          # An all-default dispatch selects no release path: every job skips
          # and the run would read green with nothing published. Fail closed
          # and name what was skipped and why.
          if (os.environ.get("DRY_RUN", "") != "true"
                  and os.environ.get("RELEASE_TAG", "") == ""):
              skipped = sorted(name for name, result in results.items()
                               if result == "skipped")
              failures.append(
                  "empty dispatch: dry_run is false and release_tag is "
                  "empty, so no release path was selected; skipped: "
                  + (", ".join(skipped) if skipped else "none")
                  + " (sbom-target needs dry_run or release_tag, "
                  "release-sbom needs sbom-target, attach-sbom needs a tag)")

          # Real dispatches behave as before: any failed or cancelled
          # dependency fails the run, while designed skips (the dry-run
          # attach) stay green.
          for job_name, result in results.items():
              if result in ("failure", "cancelled"):
                  failures.append(f"{job_name}: result={result!r}")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          print("release verdict passed")
          PY

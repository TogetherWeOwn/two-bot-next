name: release

# SBOM chain for the daily digest releases (docs/releases.md). The
# daily-digest workflow dispatches this with the digest tag it just cut, as
# its own run, so the digest run never waits for the SBOM chain. No tagging
# happens here: per-promote vX.Y.Z tagging is retired, and versions come from
# the digest tags alone.
# Dispatch inputs: `release_tag` attaches SBOM assets to a digest release (or
# repairs a pre-digest vX.Y.Z release); `dry_run` keeps the SBOM dry-run path.
# Publication dispatches must run from `main`: the target guard refuses a
# release_tag dispatch from any other ref, and only the upload step in
# `attach-sbom` holds a write token. Script execution (target selection in
# `sbom-target`, source verification in `verify-sbom`) stays read-only, and
# `attach-sbom` runs no checkout and no repository script.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and scan SBOMs without asset publication
        type: boolean
        default: false
      release_tag:
        description: Digest release to attach SBOM assets (vYYYY.MDD.P, or a legacy vYYYY.MM.DD / vX.Y.Z tag for repair)
        type: string
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  sbom-target:
    # Dry runs never publish and may run from any ref; a release_tag
    # publication must be dispatched from main.
    if: ${{ !cancelled() && (inputs.dry_run == true || (inputs.release_tag != '' && github.ref == 'refs/heads/main')) }}
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'sbom-target') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select immutable SBOM source (dry-run never publishes)
        id: target
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release-sbom-target.py

  release-sbom:
    needs: sbom-target
    if: ${{ !cancelled() && needs.sbom-target.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/sbom.yml # zizmor: ignore[self-repository] same-repo reusable call, pinned by test_workflows
    with:
      ref: ${{ needs.sbom-target.outputs.ref }}

  verify-sbom:
    needs: [sbom-target, release-sbom]
    if: ${{ !cancelled() && needs.release-sbom.result == 'success' && needs.sbom-target.outputs.tag != '' }}
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'verify-sbom') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: supply-chain
          path: sbom
      - name: Verify inventories against the published tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.sbom-target.outputs.tag }}
          EXPECTED_SHA: ${{ needs.sbom-target.outputs.ref }}
        run: |
          set -euo pipefail
          (cd sbom && sha256sum --check SHA256SUMS)
          python3 scripts/release-sbom-target.py --verify-source sbom/source-sha.txt

  attach-sbom:
    needs: [sbom-target, verify-sbom]
    if: ${{ !cancelled() && needs.verify-sbom.result == 'success' && needs.sbom-target.outputs.tag != '' && github.ref == 'refs/heads/main' }}
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'attach-sbom') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    permissions:
      contents: write
    # No checkout and no repository script: this job holds the only write
    # token in the chain and spends it solely on the asset upload. The
    # artifact is the one `verify-sbom` already checked in this run, and the
    # upload step re-resolves the tag with inline `gh api` reads so a tag
    # that moved since verification (or before an upload-only retry) fails
    # here instead of receiving the previous commit's inventories.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: supply-chain
          path: sbom
      - name: Attach verified inventories to the published tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.sbom-target.outputs.tag }}
          EXPECTED_SHA: ${{ needs.sbom-target.outputs.ref }}
        run: |
          set -euo pipefail
          (cd sbom && sha256sum --check SHA256SUMS)
          test "$(cat sbom/source-sha.txt)" = "$EXPECTED_SHA"
          # Re-resolve the tag to its commit, peeling annotated tag objects
          # (bounded, mirroring release-sbom-target.py). The Git refs API
          # names only tags, so a same-named branch cannot win.
          tag_obj=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.type, .object.sha')
          { read -r obj_type; read -r obj_sha; } <<<"$tag_obj"
          peels=0
          while [ "$obj_type" = "tag" ] && [ "$peels" -lt 8 ]; do
            tag_obj=$(gh api "repos/$GH_REPO/git/tags/$obj_sha" --jq '.object.type, .object.sha')
            { read -r obj_type; read -r obj_sha; } <<<"$tag_obj"
            peels=$((peels + 1))
          done
          test "$obj_type" = "commit"
          test "$obj_sha" = "$EXPECTED_SHA"
          gh release upload "$RELEASE_TAG" sbom/*.cdx.json sbom/SHA256SUMS sbom/source-sha.txt sbom/image-id.txt --clobber

  verdict:
    name: release verdict (fail closed on empty dispatch)
    needs: [sbom-target, release-sbom, verify-sbom, attach-sbom]
    # A skipped or failed dependency must not read as green.
    if: ${{ always() }}
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'verdict') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail closed when the dispatch selected no release path
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_REF: ${{ github.ref }}
          SBOM_TARGET_RESULT: ${{ needs.sbom-target.result }}
          RELEASE_SBOM_RESULT: ${{ needs.release-sbom.result }}
          VERIFY_SBOM_RESULT: ${{ needs.verify-sbom.result }}
          ATTACH_SBOM_RESULT: ${{ needs.attach-sbom.result }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          results = {
              "sbom-target": os.environ.get("SBOM_TARGET_RESULT", ""),
              "release-sbom": os.environ.get("RELEASE_SBOM_RESULT", ""),
              "verify-sbom": os.environ.get("VERIFY_SBOM_RESULT", ""),
              "attach-sbom": os.environ.get("ATTACH_SBOM_RESULT", ""),
          }
          failures = []

          # An all-default dispatch selects no release path: every job skips
          # and the run would read green with nothing published. Fail closed
          # and name what was skipped and why.
          if (os.environ.get("DRY_RUN", "") != "true"
                  and os.environ.get("RELEASE_TAG", "") == ""):
              skipped = sorted(name for name, result in results.items()
                               if result == "skipped")
              failures.append(
                  "empty dispatch: dry_run is false and release_tag is "
                  "empty, so no release path was selected; skipped: "
                  + (", ".join(skipped) if skipped else "none")
                  + " (sbom-target needs dry_run or release_tag, "
                  "release-sbom needs sbom-target, verify-sbom and "
                  "attach-sbom need a tag)")

          # A publication dispatch from any ref but main selects no path
          # either: the target guard skips the chain before any write token
          # exists. Name the ref so the operator redispatches from main.
          if (os.environ.get("DRY_RUN", "") != "true"
                  and os.environ.get("RELEASE_TAG", "") != ""
                  and os.environ.get("DISPATCH_REF", "") != "refs/heads/main"):
              skipped = sorted(name for name, result in results.items()
                               if result == "skipped")
              failures.append(
                  "wrong ref: release_tag publication must be dispatched "
                  "from refs/heads/main, got "
                  + (os.environ.get("DISPATCH_REF", "") or "<empty>")
                  + "; skipped: "
                  + (", ".join(skipped) if skipped else "none"))

          # Real dispatches behave as before: any failed or cancelled
          # dependency fails the run, while designed skips (the dry-run
          # attach) stay green.
          for job_name, result in results.items():
              if result in ("failure", "cancelled"):
                  failures.append(f"{job_name}: result={result!r}")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)
          print("release verdict passed")
          PY

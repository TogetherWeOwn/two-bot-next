name: attendance N-1 compatibility

# Evidence, not a deploy or a substitute for required candidate checks. Compile
# the actual prior sources against candidate-schema fixtures in private CI DBs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/attendance-n-minus-one.yml'
      - 'tests/attendance_n_minus_one/**'
      - 'crates/*/migrations/**'
      - 'migrations.lock'
      - 'crates/core/src/event_instance_store.rs'
      - 'crates/core/src/website_store.rs'
      - 'crates/bot/src/main.rs'
      - 'crates/cutover/src/db.rs'
      - 'crates/store/src/pool.rs'

permissions: {}

concurrency:
  group: attendance-n-minus-one-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    name: N-1 (${{ matrix.source }})
    permissions:
      contents: read
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'compatibility') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Recorded served source and the newer pre-attendance lifecycle source
        # exercise different writers. Neither pin is rollback qualification.
        source:
          - d314f4c63ecbea263aa953bc8a649a444a97da7c
          - ee44537ffced0f3cad734c8569fef7c96a985047
    container:
      image: rust:1.99-bookworm@sha256:9181b56c2a21ab1d5e73cffe04fc762426d30aa7fac3c91141dd033f49a7fc8b
    services:
      agent-testdb:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: two_bot_test_attendance_compatibility
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent_test -d two_bot_test_attendance_compatibility"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_attendance_compatibility
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      N_MINUS_ONE_SOURCE: ${{ matrix.source }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ATTENDANCE_CANDIDATE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Job-container prerequisites
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 >/dev/null
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: attendance-n-minus-one-${{ matrix.source }}
          save-if: false
      - name: Export pinned prior source and bind candidate schema
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$N_MINUS_ONE_SOURCE^{commit}")" = "$N_MINUS_ONE_SOURCE"
          legacy=$(mktemp -d "$RUNNER_TEMP/attendance-n-minus-one.XXXXXX")
          git archive --format=tar "$N_MINUS_ONE_SOURCE" | tar -x -C "$legacy"
          cp tests/attendance_n_minus_one/compatibility.rs.in "$legacy/crates/bot/tests/attendance_n_minus_one.rs"
          printf 'LEGACY_ROOT=%s\n' "$legacy" >> "$GITHUB_ENV"
          mkdir -p attendance-compatibility-evidence
          {
            printf 'candidate=%s\nprior_source=%s\n' "$CANDIDATE_SHA" "$N_MINUS_ONE_SOURCE"
            printf 'prior_tree=%s\n' "$(git rev-parse "$N_MINUS_ONE_SOURCE^{tree}")"
            date -u +started_at=%Y-%m-%dT%H:%M:%SZ
            rustc --version
            cargo --version
            sha256sum "$legacy/Cargo.lock"
            sha256sum tests/attendance_n_minus_one/compatibility.rs.in migrations.lock \
              crates/cutover/migrations/0471_event_attendance.sql \
              crates/cutover/migrations/0472_event_instance_windows.sql \
              crates/cutover/migrations/0475_attendance_recovery_boundary.sql
          } > attendance-compatibility-evidence/source-receipt.txt
      - name: Compile and exercise N-1 startup and writers (CI database only)
        shell: bash
        run: |
          set -euo pipefail
          cd "$LEGACY_ROOT"
          export RUSTFLAGS='--check-cfg=cfg(attendance_instance_source)'
          if [[ "$N_MINUS_ONE_SOURCE" == ee44537ffced0f3cad734c8569fef7c96a985047 ]]; then
            export RUSTFLAGS="$RUSTFLAGS --cfg=attendance_instance_source"
          fi
          python3 scripts/generate_command_reference.py
          cargo test -p two-bot --test attendance_n_minus_one --locked -- --nocapture --test-threads=1 \
            2>&1 | tee "$ATTENDANCE_CANDIDATE_ROOT/attendance-compatibility-evidence/test.log"
      - name: Retain compatibility receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attendance-n-minus-one-${{ matrix.source }}
          path: attendance-compatibility-evidence/
          if-no-files-found: error
          retention-days: 14

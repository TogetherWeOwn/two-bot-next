name: Voice workflow queue fixture driver

# Disposable push-only fixture. Do not merge.
on:
  push:
    branches: [test/voice-workflow-queue-caller]

permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Required only to dispatch the two fixture refs and rerun the verified fresh run.
      actions: write
    steps:
      - name: Exercise workflow-level queue admission outside staging
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PROBE: ${{ github.run_id }}-${{ github.run_attempt }}
          CALLER_SHA: ${{ github.sha }}
          ORDINARY_SHA: 37bfead63b4fcc515a3198a406a411a9255ff6f3
        shell: bash
        run: |
          set -u
          [[ "$REPOSITORY" == TogetherWeOwn/two-bot-next ]]
          [[ "$PROBE" =~ ^[0-9]+-[0-9]+$ && "$CALLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          root="repos/$REPOSITORY/actions"
          workflow="$root/workflows/voice-rest-measurement.yml"
          caller=test/voice-workflow-queue-caller
          ordinary=test/voice-workflow-queue-ordinary

          dispatch() {
            local role=$1 ref=$2 sha=$3 i id
            gh api --method POST "$workflow/dispatches" -f ref="$ref" \
              -f 'inputs[probe]'="$PROBE" -f 'inputs[role]'="$role" >/dev/null || return 1
            for ((i = 0; i < 35; i++)); do
              id=$(gh api --method GET "$workflow/runs" -f branch="$ref" -f event=workflow_dispatch -F per_page=30 |
                jq -r --arg title "voice-workflow-queue-$PROBE-$role" --arg sha "$sha" \
                  '.workflow_runs[] | select(.display_title == $title and .head_sha == $sha and .run_attempt == 1) | .id') || return 1
              if [[ "$id" =~ ^[0-9]+$ ]]; then
                printf '%s=%s\n' "$role" "$id" >&2
                printf '%s\n' "$id"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          run_field() { gh api "$root/runs/$1" --jq "$2"; }
          jobs() { gh api "$root/runs/$1/attempts/$2/jobs"; }
          wait_for() {
            for ((i = 0; i < $1; i++)); do
              if [[ $(run_field "$2" "$3") == "$4" ]]; then return 0; fi
              sleep 2
            done
            printf 'Run %s did not reach %s=%s\n' "$2" "$3" "$4" >&2
            return 1
          }
          holding() {
            jobs "$holder" 1 | jq -e '.jobs[] | select(.name == "ordinary") |
              .status == "in_progress" and .runner_id > 0' >/dev/null
          }
          fresh=$(dispatch fresh "$caller" "$CALLER_SHA")
          wait_for 70 "$fresh" .conclusion success
          jobs "$fresh" 1 | jq -e '.jobs[] | select(.name == "acquired") | .conclusion == "success"' >/dev/null

          holder=$(dispatch holder "$ordinary" "$ORDINARY_SHA")
          for ((i = 0; i < 70; i++)); do
            if holding; then break; fi
            sleep 2
          done
          holding
          waiter=$(dispatch waiter "$ordinary" "$ORDINARY_SHA")
          wait_for 25 "$waiter" .status pending
          holding
          printf '%s\n' 'The ordinary waiter is pending behind the confirmed holder.'
          contender=$(dispatch contended "$caller" "$CALLER_SHA")
          holding
          gh api --method POST "$root/runs/$fresh/rerun" >/dev/null
          wait_for 35 "$fresh" '.run_attempt | tostring' 2
          wait_for 35 "$fresh" .conclusion failure
          holding
          jobs "$fresh" 2 | jq -e '
            any(.jobs[]; .name == "rerun-refusal" and .conclusion == "failure") and
            all(.jobs[]; .name != "acquired" or .conclusion == "skipped")' >/dev/null
          printf '%s\n' 'Attempt two finished its refusal before the ordinary holder released the group.'

          wait_for 90 "$holder" .conclusion success
          wait_for 60 "$waiter" .conclusion success
          wait_for 60 "$contender" .status completed
          holder_end=$(jobs "$holder" 1 | jq -er '.jobs[] | select(.name == "ordinary") | .completed_at')
          case $(run_field "$contender" .conclusion) in
            cancelled)
              jobs "$contender" 1 | jq -e '
                (.jobs | type == "array") and
                all(.jobs[]; (.runner_id // 0) == 0 and (.runner_name // "") == "")' >/dev/null
              printf '%s\n' 'The original waiter succeeded; the contender was cancelled before runner assignment.'
              ;;
            success)
              jobs "$contender" 1 | jq -e --arg end "$holder_end" \
                '.jobs[] | select(.name == "acquired") | .conclusion == "success" and .started_at >= $end' >/dev/null
              printf '%s\n' 'The original waiter succeeded; the contender acquired only after the holder released.'
              ;;
            *) printf '%s\n' 'Unexpected contended conclusion.' >&2; exit 1 ;;
          esac

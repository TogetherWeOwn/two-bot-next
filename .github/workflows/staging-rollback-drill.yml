name: staging-rollback-drill

# On-demand recovery proof, staging only. The dispatcher never holds the
# deploy-staging lock while waiting for its child. A manual target retains the
# original Worker-only backout/restore drill, serialized in the staging lane.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full candidate commit SHA for the automatic rollback proof
        type: string
        required: false
        default: ""
      target_version:
        description: Optional previously served staging Worker UUID for the manual Worker-only drill; empty runs the automatic rollback proof
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: staging-rollback-proof-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  proof:
    name: on-demand staging automatic rollback proof
    if: github.ref == 'refs/heads/main' && inputs.target_version == ''
    permissions:
      contents: read
      actions: write # Fixed deploy-staging dispatch, then read that exact run and its artifacts.
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/rollback_proof.py
            /scripts/script_intake.py
            /scripts/incident_issue.py
      - name: Prove the staging failure-to-restore chain
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: python3 scripts/rollback_proof.py run --sha "$REQUESTED_SHA" --evidence "$RUNNER_TEMP/proof.json"
      - name: Upload the rollback proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: >-
            ${{ github.run_attempt == '1' && 'staging-rollback-proof' ||
            format('staging-rollback-proof-attempt-{0}', github.run_attempt) }}
          path: ${{ runner.temp }}/proof.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  alert:
    name: alert on a failed staging rollback proof
    needs: proof
    if: ${{ !cancelled() && needs.proof.result == 'failure' }}
    permissions:
      contents: read
      issues: write # open or comment on the staging-rollback-proof incident issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/rollback_proof.py
            /scripts/script_intake.py
            /scripts/incident_issue.py
      - name: File the incident issue for the failed proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/rollback_proof.py alert

  drill:
    name: staging worker rollback drill
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target_version != ''
    permissions:
      contents: read # checkout only; the drill authenticates with staging environment secrets
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-lifecycle
      cancel-in-progress: false
      queue: max
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/build_identity.py
            /scripts/script_intake.py
            /scripts/staging_drill_use.py
            /scripts/staging_rollback_drill.py
            /scripts/staging_rollout.py
            /scripts/worker_container_rollback.py
            /wrangler/scripts/is-direct-invocation.mjs
            /wrangler/scripts/ownership-control-response.mjs
            /wrangler/scripts/ownership-control.mjs
            /wrangler/scripts/staging-use-pipeline.mjs
            /wrangler/scripts/staging-use.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run the staging rollback drill
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_VERSION: ${{ inputs.target_version }}
          STAGING_USE_RECEIPT: ${{ runner.temp }}/staging-worker-drill-use.ndjson
        run: python3 scripts/staging_rollback_drill.py --target-version "$TARGET_VERSION" --evidence "$RUNNER_TEMP/staging-rollback-drill-evidence.json"
      - name: Upload the manual Worker drill evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-worker-rollback-drill
          path: |
            ${{ runner.temp }}/staging-rollback-drill-evidence.json
            ${{ runner.temp }}/staging-worker-drill-use.ndjson
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

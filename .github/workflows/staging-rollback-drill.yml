name: staging-rollback-drill

# Daily automatic recovery proof, staging only. The dispatcher never holds the
# deploy-staging lock while waiting for its child. A manual target retains the
# original Worker-only backout/restore drill, serialized in the staging lane.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      target_version:
        description: Optional previously served staging Worker UUID for the manual Worker-only drill; empty runs the automatic rollback proof
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  # A later manual dispatch cannot replace the pending scheduled proof.
  group: staging-rollback-proof-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  proof:
    name: daily staging automatic rollback proof
    if: github.ref == 'refs/heads/main' && inputs.target_version == ''
    permissions:
      contents: read
      actions: write # Fixed deploy-staging dispatch, then read that exact run and its artifacts.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'proof') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prove the staging failure-to-restore chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/rollback_proof.py run --evidence "$RUNNER_TEMP/proof.json"
      - name: Upload the daily rollback proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-rollback-proof
          path: ${{ runner.temp }}/proof.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  alert:
    name: alert on a failed staging rollback proof
    needs: proof
    if: ${{ !cancelled() && needs.proof.result == 'failure' }}
    permissions:
      contents: read
      issues: write # open or comment on the staging-rollback-proof incident issue
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'alert') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: File the incident issue for the failed proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/rollback_proof.py alert

  drill:
    name: staging worker rollback drill
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target_version != ''
    permissions:
      contents: read # checkout only; the drill authenticates with staging environment secrets
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'drill') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run the staging rollback drill
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: python3 scripts/staging_rollback_drill.py --target-version "$TARGET_VERSION" --evidence "$RUNNER_TEMP/staging-rollback-drill-evidence.json"
      - name: Upload the manual Worker drill evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-worker-rollback-drill
          path: ${{ runner.temp }}/staging-rollback-drill-evidence.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

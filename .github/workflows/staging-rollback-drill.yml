name: staging-rollback-drill

# Manual, staging-only Worker-version rollback drill (docs/runbook.md
# "Worker-version rollback"). Never runs automatically and has no production
# path. The reviewed script fences the staging singleton, moves the Worker to
# the named version (which must already have served staging traffic), hands
# ownership to it, times the first /readyz 200, then restores the original
# version the same way. It reads only the `staging` environment's existing
# ownership-control pair and Cloudflare token; it creates or changes no
# credential and never prints a body or a secret. Shares the deploy-staging
# concurrency group so a push-triggered deploy cannot interleave with a drill.
on:
  workflow_dispatch:
    inputs:
      target_version:
        description: Worker version id (UUID) that already served staging traffic and is compatible with the current schema; never "latest"
        type: string
        required: true

permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  drill:
    name: staging worker rollback drill
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read # checkout only; the drill authenticates with `staging` environment secrets
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'drill') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run the staging rollback drill
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: python3 scripts/staging_rollback_drill.py --target-version "$TARGET_VERSION" --evidence "$RUNNER_TEMP/staging-rollback-drill-evidence.json"

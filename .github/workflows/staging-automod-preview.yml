name: staging-automod-preview

on:
  workflow_dispatch:
    inputs:
      rehearse:
        description: Request the guarded AutoMod staging rehearsal
        type: boolean
        default: false
permissions: {}

# Only an eligible direct dispatch can hold the shared staging window.
concurrency:
  group: >-
    ${{ inputs.rehearse && github.repository_id == '1396224242' && github.ref == 'refs/heads/main' &&
    github.workflow_ref == 'TogetherWeOwn/two-bot-next/.github/workflows/staging-automod-preview.yml@refs/heads/main' &&
    github.event_name == 'workflow_dispatch' && github.ref_protected && github.run_attempt == 1 &&
    'staging-lifecycle' || format('staging-automod-refused-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false
  queue: max

jobs:
  dry-run:
    if: >-
      inputs.rehearse && github.repository_id == '1396224242' && github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'TogetherWeOwn/two-bot-next/.github/workflows/staging-automod-preview.yml@refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.ref_protected && github.run_attempt == 1
    environment: {name: staging, deployment: false}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Exercise the AutoMod dry-run job with a synthetic invoker
        run: node --test wrangler/test/staging-automod-workflow.test.ts
      - name: Exercise the private AutoMod binding with synthetic authority
        run: node --test wrangler/test/staging-automod-workflow-binding.test.ts
      - name: Exercise the AutoMod operator entry with synthetic run evidence
        run: node --test wrangler/test/staging-automod-operator-entry.test.ts
      - name: Run the guarded AutoMod rehearsal entry
        env:
          STAGING_AUTOMOD_REHEARSAL: ${{ inputs.rehearse }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
        run: node wrangler/scripts/staging-automod-dispatch.ts

name: staging-automod-preview

# Reserved for a separate protected staging caller. Both steps use synthetic authority and effects.
on:
  workflow_call:
permissions: {}

# This lane must own the whole window. Its future caller cannot hold this group.
concurrency:
  group: staging-lifecycle
  cancel-in-progress: false
  queue: max

jobs:
  dry-run:
    # A reusable workflow sees the caller's workflow ref. This file has no
    # dispatch trigger, so no caller can satisfy this condition.
    if: >-
      github.workflow_ref == 'TogetherWeOwn/two-bot-next/.github/workflows/staging-automod-preview.yml@refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.ref_protected && github.run_attempt == 1
    environment: {name: staging, deployment: false}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Exercise the AutoMod dry-run job with a synthetic invoker
        run: node --test wrangler/test/staging-automod-workflow.test.ts
      - name: Exercise the private AutoMod binding with synthetic authority
        run: node --test wrangler/test/staging-automod-workflow-binding.test.ts

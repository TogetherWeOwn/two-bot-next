name: Uniform queue fixture target
run-name: uniform-queue-${{ inputs.probe }}-${{ inputs.role }}

# Disposable test ref only; no checkout, credentials, or staging resources.
on:
  workflow_dispatch:
    inputs:
      probe:
        required: true
        type: string
      role:
        required: true
        type: choice
        options: [fresh, outer-holder, outer-waiter, inner-holder, inner-waiter, contender]

permissions: {}
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/voice-uniform-queue' && github.run_attempt == 1 && !startsWith(inputs.role, 'inner-') && format('voice-uniform-fixture-{0}', inputs.probe) || format('voice-uniform-isolated-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false
  queue: max

jobs:
  outer:
    if: github.ref == 'refs/heads/test/voice-uniform-queue' && github.run_attempt == 1 && !startsWith(inputs.role, 'inner-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hold the fixture group
        if: inputs.role == 'outer-holder'
        run: sleep 180
      - run: printf '%s\n' 'Finished workflow-level fixture job.'
  inner:
    if: github.ref == 'refs/heads/test/voice-uniform-queue' && github.run_attempt == 1 && startsWith(inputs.role, 'inner-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ format('voice-uniform-fixture-{0}', inputs.probe) }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Hold the fixture group
        if: inputs.role == 'inner-holder'
        run: sleep 180
      - run: printf '%s\n' 'Finished job-level fixture job.'
  rerun-refusal:
    if: always() && github.ref == 'refs/heads/test/voice-uniform-queue' && github.run_attempt != 1
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: exit 1

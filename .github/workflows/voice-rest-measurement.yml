name: Voice queue fixture (caller)
run-name: voice-workflow-queue-${{ inputs.probe }}-${{ inputs.role }}

# Disposable fixture ref only. No staging jobs, environments or credentials.
on:
  workflow_dispatch:
    inputs:
      probe:
        required: true
        type: string
      role:
        required: true
        type: choice
        options: [fresh, contended]

permissions: {}
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/voice-workflow-queue-caller' && github.run_attempt == 1 && format('voice-workflow-queue-fixture-{0}', inputs.probe) || format('voice-workflow-queue-refused-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false
  queue: max

jobs:
  acquired:
    if: github.ref == 'refs/heads/test/voice-workflow-queue-caller' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: printf '%s\n' 'Entered the fixture group on attempt one.'
  rerun-refusal:
    if: always() && github.ref == 'refs/heads/test/voice-workflow-queue-caller' && github.run_attempt != 1
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: exit 1

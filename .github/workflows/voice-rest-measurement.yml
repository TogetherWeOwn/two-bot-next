name: Voice queue fixture (ordinary)
run-name: voice-workflow-queue-${{ inputs.probe }}-${{ inputs.role }}

# Disposable fixture ref only. No staging jobs, environments or credentials.
on:
  workflow_dispatch:
    inputs:
      probe:
        required: true
        type: string
      role:
        required: true
        type: choice
        options: [holder, waiter]

permissions: {}
concurrency:
  group: ${{ format('voice-workflow-queue-fixture-{0}', inputs.probe) }}
  cancel-in-progress: false

jobs:
  ordinary:
    if: github.ref == 'refs/heads/test/voice-workflow-queue-ordinary' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Hold the fixture group
        if: inputs.role == 'holder'
        run: sleep 150
      - name: Finish the ordinary request
        run: ':'

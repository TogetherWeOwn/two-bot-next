name: PR evidence
on:
  pull_request: {types: [opened, edited, synchronize, reopened, ready_for_review]}
permissions: {}
concurrency:
  group: pr-evidence-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pr-evidence:
    permissions: {actions: read, contents: read, pull-requests: read}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOOTSTRAP: ${{ github.event.pull_request.number == 2357 && github.repository == 'TogetherWeOwn/two-bot-next' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' }}
      EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'push' || env.BOOTSTRAP == 'true') && github.sha || 'refs/heads/main' }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TogetherWeOwn/.github
          ref: bfdaf1532e1605281d366186e4ed9e8cfa0113fc
          path: attestation-policy
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: 'python3 -m pip --isolated install --no-deps --only-binary=:all: --require-hashes -r .github/scripts/pr-evidence-requirements.txt'
      - if: github.event_name == 'pull_request'
        run: git fetch --quiet --no-tags --unshallow origin "$EVIDENCE_HEAD" "$PR_BASE"
      - name: Verify and publish evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -I .github/scripts/pr_evidence.py verify
      - run: python3 -I -m unittest discover -s .github/scripts -p test_pr_evidence.py -v

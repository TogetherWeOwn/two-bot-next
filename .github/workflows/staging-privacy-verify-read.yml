name: staging-privacy-verify-read

# Manual, staging-only, read-only privacy-verification read for one fixture
# pair (docs/privacy.md staging section). It hands QA the purge-verification
# counts without handing any agent a database credential. Never runs
# automatically and has no production path. It reads only the
# `staging-privacy-verify-read` environment's existing bindings: the secret
# TWO_BOT_STAGING_PRIVACY_RO_DATABASE_URL (role two_bot_privacy_verify_ro,
# column-limited SELECT on exactly six tables), the secret
# STAGING_PRIVACY_VERIFY_EXPECTED_HOST pin, the secret
# STAGING_FIXTURE_MEMBER_ID, and the secret STAGING_PRIVACY_VERIFY_H_GUILD_ID
# (second-guild pin, set only after it is recorded and verified not-live
# through the normal config path). It creates or changes no credential.
# A missing binding is refused before any connection;
# the environment's main-only policy must be verified during setup.
#
# The dispatcher chooses only the guild alias (`g` or `h`); the alias maps
# to its pinned guild inside the script, so a dispatch cannot aim the read
# at any other guild. The fixture member is a secret, not a dispatch input
# and not a variable: a step's env block is printed on the (public) run page
# with variable values in clear, and a dispatcher must not be able to aim
# the read at another member. The artifact carries only the guild alias,
# all-time pair counts, the beyond-ownership sweep counts, receipt actors
# and timestamps; member, guild pins, sources and metadata never reach the
# artifact, the log or the step summary.
on:
  workflow_dispatch:
    inputs:
      guild:
        description: "Staging guild alias to verify: g (TWO Staging) or h (second guild, refuses until its pin is recorded and verified not-live)"
        type: choice
        options: [g, h]
        required: true

permissions: {}

concurrency:
  group: staging-privacy-verify-read
  cancel-in-progress: false

jobs:
  read:
    name: staging privacy verify read
    permissions:
      contents: read
    # Dispatch from main only. The bindings are scoped to the
    # staging-privacy-verify-read environment (main-only deployment branches, no
    # reviewer: the job is read-only, column-limited and count-capped) so a
    # workflow edited on another branch cannot read them.
    if: github.ref == 'refs/heads/main'
    environment: staging-privacy-verify-read
    # Runner routing: see the note on `check` in check.yml. The script needs
    # `psql`, which GitHub-hosted runners ship.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'read') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read the fixture pair's privacy verification counts
        env:
          # Must already exist as staging-privacy-verify-read environment secrets;
          # absent means refusal before any connection. Secrets print as ***.
          TWO_BOT_STAGING_PRIVACY_RO_DATABASE_URL: ${{ secrets.TWO_BOT_STAGING_PRIVACY_RO_DATABASE_URL }}
          STAGING_PRIVACY_VERIFY_EXPECTED_HOST: ${{ secrets.STAGING_PRIVACY_VERIFY_EXPECTED_HOST }}
          STAGING_FIXTURE_MEMBER_ID: ${{ secrets.STAGING_FIXTURE_MEMBER_ID }}
          STAGING_PRIVACY_VERIFY_H_GUILD_ID: ${{ secrets.STAGING_PRIVACY_VERIFY_H_GUILD_ID }}
          GUILD: ${{ inputs.guild }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/staging_privacy_verify_read.py --guild "$GUILD" --output "staging-privacy-verify-read-$RUN_ID.json"
      - name: Upload the sanitized read
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-privacy-verify-read-${{ github.run_id }}
          path: staging-privacy-verify-read-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 14

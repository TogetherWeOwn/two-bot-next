name: deploy-staging

# Staging only. Accept the intended new rollout + serving image, never an old
# healthy singleton. Production deploys remain manual and cutover-owned.
# Active (TOG-12856): runs on a push to main that changes runtime inputs, and
# on manual dispatch. The deploy job runs unconditionally in the `staging`
# environment; `release_fence` only releases an uninitialized/parked singleton
# after handoff authorization and defaults to false.
#
# Each deploy restarts the bot container and drops the gateway for 95-139 s, so
# a push that only touches the paths below starts no run at all: the B2 soak
# needs a stable gateway, and a docs merge changes nothing it serves. A
# deny-list (`paths-ignore`), not an allow-list, so a path nobody classified
# (a new top-level directory, a nested README under crates/) still deploys.
# GitHub skips the run only when EVERY changed path matches, so a merge that
# mixes docs with `crates/**`, `wrangler/**`, Cargo or workflow files deploys.
# `deploy-staging` is not a required check, so a workflow-level filter cannot
# strand a PR. scripts/ci/test_workflows.py pins this list against sample
# runtime paths; the same non-runtime set is vetted in scripts/container-inputs.py.
# Consequence: `deploy-production` needs a green run on its exact SHA. With an
# empty `sha` it promotes the latest successful run's commit automatically; to
# deploy a docs-only head, dispatch this workflow for it first.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md' # root markdown only; `*` never crosses `/`, so nested READMEs still deploy
      - LICENSE
      - .editorconfig
      - .gitignore
      - .gitleaks.toml
      - .gitleaksignore
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
      - .github/CODEOWNERS
      - .github/dependabot.yml
  workflow_dispatch:
    inputs:
      release_fence:
        description: Explicitly release an uninitialized/parked STAGING singleton after handoff authorization
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Pre-deploy schema-drift gate: a drifted staging database fails this job
  # (and, through `needs`, the deploy below) instead of staying red silently.
  # Read-only `staging-migrate plan` through the no-reviewer
  # `staging-migrate-plan` environment binding; the expected host/database/
  # branch pins are non-secret `vars.*` compared against that binding (never
  # derived from it), so a wrong-target binding refuses instead of reading
  # the wrong database. Drift is fixed by the manual staging-migrate apply
  # dispatch named in the failure, never by this workflow (plan-only; the
  # `db roles` CLI is plan/verify only by design, and the reviewed-apply
  # fence is untouched).
  schema-gate:
    name: schema drift gate (staging-migrate plan)
    permissions:
      contents: read
    # No `if:`: every deploy must prove a drift-free staging DB first. A
    # skipped gate with a green deploy would re-create the silent-red staging.
    environment: staging-migrate-plan
    # Runner routing: same expression as every job in every workflow; see the
    # note on `check` in check.yml. A bare self-hosted label would queue
    # forever on the public repo.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'schema-gate') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 30
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Deploy SHA must be exact
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Build runner
        run: cargo build -p two-bot-cutover --bin staging-migrate --locked
      - name: Fail closed on schema drift
        env:
          # Must already exist as a staging-migrate-plan environment secret; absent means refusal.
          # Read-only login: the gate never applies and never reads the migrator binding.
          TWO_BOT_STAGING_PLAN_DATABASE_URL: ${{ secrets.TWO_BOT_STAGING_PLAN_DATABASE_URL }}
          # Non-secret expected staging identity (repo/org vars, Operator-owned):
          # the gate refuses unless the secret binding matches these pins.
          TWO_BOT_STAGING_HOST: ${{ vars.TWO_BOT_STAGING_HOST }}
          TWO_BOT_STAGING_DATABASE: ${{ vars.TWO_BOT_STAGING_DATABASE }}
          TWO_BOT_STAGING_BRANCH_ID: ${{ vars.TWO_BOT_STAGING_BRANCH_ID }}
          SOURCE_SHA: ${{ github.sha }}
        # `shell: bash` runs with `-eo pipefail`. The container's default `sh`
        # has no pipefail, so a gate refusal piped anywhere would read green.
        # `set -o pipefail` is belt-and-braces for the same guarantee if the
        # shell key is ever re-targeted; the workflow-policy test pins both.
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci/staging_schema_gate.py \
            --binary ./target/debug/staging-migrate --source-sha "$SOURCE_SHA"
  deploy:
    name: wrangler deploy + intended rollout gate
    needs: schema-gate
    permissions:
      contents: read # checkout only; the deploy authenticates with `staging` environment secrets
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'deploy') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    # TOG-11143: STAGING_OWNERSHIP_CONTROL_TOKEN is a `staging` environment
    # secret (TOG-12030); the job must declare the environment to read it.
    environment: staging
    # Sized for the worst case: the deploy, a failing verify and the
    # auto-rollback budget (600 s image + 900 s gate). A 30 min cap can
    # cancel the run mid-rollback and leave staging fenced.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: wrangler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # The runner context is not available in job-level env, so derive the
      # per-attempt paths here and export them to every later step.
      - name: Set per-attempt rollout paths
        run: |
          set -euo pipefail
          rollout_dir="$RUNNER_TEMP/two-bot-staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "ROLLOUT_DIR=$rollout_dir" >> "$GITHUB_ENV"
          echo "WRANGLER_OUTPUT_FILE_PATH=$rollout_dir/wrangler-output.ndjson" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Deploys must not consume caches populated by untrusted PR checks.
          package-manager-cache: false
      - run: npm ci
      # Validate the dedicated staging control binding BEFORE replacing a healthy
      # deployment. Missing credentials are not permission to auto-claim an owner.
      - name: Require staging ownership-control configuration
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
        run: node scripts/ownership-control.mjs preflight
      - name: Snapshot staging identity and generate per-deploy image provenance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_URL: ${{ vars.STAGING_WORKER_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$ROLLOUT_DIR"
          python3 ../scripts/staging_rollout.py prepare \
            --receipt "$ROLLOUT_DIR/baseline.json" \
            --output "$WRANGLER_OUTPUT_FILE_PATH" \
            --deploy-config "$ROLLOUT_DIR/staging-deploy.json"
      # Snapshot the serving Worker version and container image BEFORE
      # replacing anything: a failed verify below auto-rolls back to exactly
      # this state. Allowlisted IDs only, safe to keep as a run artifact.
      - name: Snapshot the pre-deploy rollback state
        id: snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 ../scripts/worker_container_rollback.py snapshot \
            --variant staging \
            --out "$ROLLOUT_DIR/staging-rollback-snapshot.json"
          python3 -c 'import json, os; print(json.dumps(json.load(open(os.environ["ROLLOUT_DIR"] + "/staging-rollback-snapshot.json")), sort_keys=True))'
      - name: Deploy to staging
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: wrangler
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: staging
          wranglerVersion: "4.149.0"
          command: deploy --config ${{ env.ROLLOUT_DIR }}/staging-deploy.json --env staging
      # Ordering (TOG-12939): ownership must not move to a deploy whose Wrangler
      # receipt is not valid, fresh and pinned, so that part of the gate runs
      # here, before the transfer. It reads only the local NDJSON (no network,
      # no Cloudflare credentials). Readiness cannot be proven earlier: a fenced
      # or non-owner singleton refuses /readyz, so the rollout/readiness half
      # stays in `verify` after the transfer. A red `verify` therefore leaves
      # staging owned by a Worker whose identity was already checked but whose
      # rollout was not confirmed; the owner stays `active`, so the next push
      # can hand off again, and the red run is the alert.
      - name: Validate Wrangler deploy receipt before ownership transfer
        run: |
          set -euo pipefail
          python3 ../scripts/staging_rollout.py receipt \
            --receipt "$ROLLOUT_DIR/baseline.json" \
            --output "$WRANGLER_OUTPUT_FILE_PATH" \
            --evidence "$ROLLOUT_DIR/receipt.json"
      - name: Transfer staging ownership to the deployed version
        id: takeover
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
          OWNERSHIP_ACTOR: github-actions:${{ github.run_id }}:${{ github.sha }}
          OWNERSHIP_RELEASE_FENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_fence && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # Pin the takeover client to the receipt-validated Worker version, so a
          # retry answered by a stale version refuses while the old-to-new
          # handover still re-posts. The receipt holds only the version UUID.
          # The fence release route is shown only for the intentionally-fenced
          # refusal; any other failure (auth, transition-not-confirmed) takes
          # the generic branch, never the fence guidance.
          if output="$(
            timeout --signal=TERM --kill-after=10s 240s \
              env OWNERSHIP_EXPECTED_DEPLOYMENT="$(python3 -c 'import json,os;print(json.load(open(os.environ["ROLLOUT_DIR"]+"/receipt.json"))["worker_version"])')" \
              node scripts/ownership-control.mjs deployment-takeover 2>&1
          )"; then
            printf '%s\n' "$output"
          else
            result=$?
            echo "$output" >&2
            if [[ $result -eq 124 || $result -eq 137 ]]; then
              echo "::error::Staging ownership takeover timed out after 240 seconds; verify rollback evidence and current ownership, and do not release the fence manually."
              exit 1
            fi
            case "$output" in
              *"Singleton is intentionally fenced or uninitialized"*)
                echo "::error::Staging singleton fenced: re-run Actions > deploy-staging > Run workflow with release_fence checked after handoff authorization (or: gh workflow run deploy-staging.yml --ref main -f release_fence=true). A push/default never releases; do not change credentials." ;;
              *)
                echo "::error::Staging ownership takeover failed (not a fence refusal); see the control-client output above. Do not change credentials." ;;
            esac
            exit 1
          fi
      - name: Verify exact new rollout and serving Worker/container readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_URL: ${{ vars.STAGING_WORKER_URL }}
        run: |
          set -euo pipefail
          python3 ../scripts/staging_rollout.py verify \
            --receipt "$ROLLOUT_DIR/baseline.json" \
            --output "$WRANGLER_OUTPUT_FILE_PATH" \
            --evidence "$ROLLOUT_DIR/evidence.json"
          # Evidence contains only allowlisted version/digest/build IDs + statuses.
          # No raw Wrangler sessions, CF configs, env values or HTTP error bodies.
          python3 -c 'import json, os; print(json.dumps(json.load(open(os.environ["ROLLOUT_DIR"] + "/evidence.json")), sort_keys=True))'
      # A failed verify after a deploy rolls back automatically to the
      # pre-deploy snapshot (Worker version AND container image, with
      # takeover). The run still fails red: the rollback restores service,
      # it never certifies the build. Without a deploy or a snapshot there
      # is nothing to restore.
      - name: Auto-roll back Worker version and container image
        id: auto_rollback
        if: failure() && steps.deploy.outcome == 'success' && steps.snapshot.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          ROLLBACK_ACTOR: github-actions:${{ github.run_id }}:${{ github.sha }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          # No --expected-sha: the snapshot restores the previous serving
          # build, whose /readyz reports the previous revision, not the
          # failed SHA. Identity rests on the restored Worker version header.
          python3 ../scripts/worker_container_rollback.py rollback \
            --variant staging \
            --worker-url "$STAGING_WORKER_URL" \
            --snapshot "$ROLLOUT_DIR/staging-rollback-snapshot.json" \
            --actor "$ROLLBACK_ACTOR" \
            --evidence "$ROLLOUT_DIR/auto-rollback-evidence.json"
          python3 -c 'import json, os; print(json.dumps(json.load(open(os.environ["ROLLOUT_DIR"] + "/auto-rollback-evidence.json")), sort_keys=True))'
      - name: Upload the rollout evidence
        if: always() && steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-rollout-evidence
          path: ${{ env.ROLLOUT_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Live voice synthetic against the deployed staging bot (docs/voice-synthetic.md).
  # A failure fails this workflow run, and deploy-production only promotes a
  # commit whose latest deploy-staging run succeeded, so a broken temp-voice
  # lifecycle cannot reach production.
  voice-synthetic:
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/voice-synthetic.yml # zizmor: ignore[self-repository] same-repo reusable call, pinned by test_workflows
    # By name, not `inherit`: only the test bot token crosses the boundary.
    secrets:
      TWO_VOICE_SYNTHETIC_BOT_TOKEN: ${{ secrets.TWO_VOICE_SYNTHETIC_BOT_TOKEN }}

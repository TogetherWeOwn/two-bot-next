name: deploy-staging

# AUTOMATED staging deployment and HTTP probes are suspended (TOG-10894).
# The entire job is statically disabled for push and dispatch, before runner or
# secret resolution. A skipped job is NOT deployment, readiness or E2E evidence.
# Activation requires the actual protected-staging/secret-placement evidence,
# separate approval and independent exact-head review (TOG-11271).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_fence:
        description: Explicitly release an uninitialized/parked STAGING singleton after handoff authorization
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy + readyz gate
    if: ${{ false }} # zizmor: ignore[obfuscation] explicit unconditional suspension, tested offline
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'deploy') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    # TOG-11143: STAGING_OWNERSHIP_CONTROL_TOKEN is a `staging` environment
    # secret (TOG-12030); the job must declare the environment to read it.
    # (Kept while the job is suspended so re-activation cannot drop the scope.)
    environment: staging
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wrangler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # Deploys must not consume caches populated by untrusted PR checks.
          package-manager-cache: false
      - run: npm ci
      # Validate the dedicated staging control binding BEFORE replacing a healthy
      # deployment. Missing credentials are not permission to auto-claim an owner.
      - name: Require staging ownership-control configuration
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
        run: node scripts/ownership-control.mjs preflight
      - name: Deploy to staging
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: wrangler
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: staging
      - name: Transfer staging ownership to the deployed version
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
          OWNERSHIP_ACTOR: github-actions:${{ github.run_id }}:${{ github.sha }}
          OWNERSHIP_RELEASE_FENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_fence && 'true' || 'false' }}
        run: node scripts/ownership-control.mjs deployment-takeover
      # S1 contract (TOG-9907): /health must be 200 — that proves the
      # Container/DO bindings are wired (HTTP 1101 meant env.TWO_BOT was
      # undefined). /readyz is truthfully 503 while the gateway supervisor is
      # parked: S2 (TOG-9807) connects the shard, S3 (TOG-9808) wires the
      # pipeline, so only S2/S3 may turn this gate's 503 into a 200.
      # Never fake readyz success to pass CI.
      - name: Gate on /health + truthful /readyz
        env:
          STAGING_URL: ${{ vars.STAGING_WORKER_URL }}
        run: |
          set -euo pipefail
          test -n "$STAGING_URL" || {
            echo "STAGING_WORKER_URL repo variable is not set;"
            echo "ask the operator to add it (see docs/staging-soak.md), then re-run."
            exit 1
          }
          # Container cold start can take a minute; poll /health up to ~5 min.
          # Per-job $RUNNER_TEMP: fixed /tmp paths collide across the runners
          # sharing one Docker host (TOG-11810).
          for i in $(seq 1 30); do
            code=$(curl -s -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$STAGING_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "health 200 after ~$((i * 10))s"
              cat "$RUNNER_TEMP/health.json"
              break
            fi
            echo "attempt $i: /health -> $code; waiting 10s"
            if [ "$i" = "30" ]; then
              echo "health never returned 200 (bindings still broken?)"
              cat "$RUNNER_TEMP/health.json" || true
              exit 1
            fi
            sleep 10
          done
          # /readyz must answer with a component breakdown: 200 once S2/S3
          # meet contract, 503 while the shard is parked. Anything else
          # (500/1101/...) means the deploy is still broken.
          code=$(curl -s -o "$RUNNER_TEMP/readyz.json" -w '%{http_code}' "$STAGING_URL/readyz" || true)
          echo "readyz -> $code"
          cat "$RUNNER_TEMP/readyz.json" || true
          # Ownership refusal is also 503, but must NEVER pass this gate.
          # $RUNNER_TEMP: fixed /tmp paths collide across the runners sharing
          # one Docker host (TOG-11810).
          node scripts/check-readyz.mjs "$code" "$RUNNER_TEMP/readyz.json"

name: deploy-staging

# Deploys the Worker + Container to the staging environment on every push to
# main, then gates on /readyz: the container must report the gateway ready
# against the staging guild. Prod deploys are manual (B4 owns the cutover).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy + readyz gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wrangler
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wrangler/package-lock.json
      - run: npm ci
      - name: Deploy to staging
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: wrangler
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: staging
      # S1 contract (TOG-9907): /health must be 200 — that proves the
      # Container/DO bindings are wired (HTTP 1101 meant env.TWO_BOT was
      # undefined). /readyz is truthfully 503 while the gateway supervisor is
      # parked: S2 (TOG-9807) connects the shard, S3 (TOG-9808) wires the
      # pipeline, so only S2/S3 may turn this gate's 503 into a 200.
      # Never fake readyz success to pass CI.
      - name: Gate on /health + truthful /readyz
        env:
          STAGING_URL: ${{ vars.STAGING_WORKER_URL }}
        run: |
          set -euo pipefail
          test -n "$STAGING_URL" || {
            echo "STAGING_WORKER_URL repo variable is not set;"
            echo "ask the operator to add it (see docs/staging-soak.md), then re-run."
            exit 1
          }
          # Container cold start can take a minute; poll /health up to ~5 min.
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$STAGING_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "health 200 after ~$((i * 10))s"
              cat /tmp/health.json
              break
            fi
            echo "attempt $i: /health -> $code; waiting 10s"
            if [ "$i" = "30" ]; then
              echo "health never returned 200 (bindings still broken?)"
              cat /tmp/health.json || true
              exit 1
            fi
            sleep 10
          done
          # /readyz must answer with a component breakdown: 200 once S2/S3
          # meet contract, 503 while the shard is parked. Anything else
          # (500/1101/...) means the deploy is still broken.
          code=$(curl -s -o /tmp/readyz.json -w '%{http_code}' "$STAGING_URL/readyz" || true)
          echo "readyz -> $code"
          cat /tmp/readyz.json || true
          case "$code" in
            200) echo "gateway ready" ;;
            503) echo "gateway parked (S2/S3 pending); deploy is healthy" ;;
            *) echo "unexpected readyz status $code"; exit 1 ;;
          esac

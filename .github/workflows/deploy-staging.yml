name: deploy-staging

# Deploys the Worker + Container to the staging environment on every push to
# main, then gates on /readyz: the container must report the gateway ready
# against the staging guild. Prod deploys are manual (B4 owns the cutover).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_fence:
        description: Explicitly release an uninitialized/parked STAGING singleton after handoff authorization
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy + readyz gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wrangler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wrangler/package-lock.json
      - run: npm ci
      # Validate the dedicated staging control binding BEFORE replacing a healthy
      # deployment. Missing credentials are not permission to auto-claim an owner.
      - name: Require staging ownership-control configuration
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
        run: node scripts/ownership-control.mjs preflight
      - name: Deploy to staging
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: wrangler
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: staging
      - name: Transfer staging ownership to the deployed version
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
          OWNERSHIP_ACTOR: github-actions:${{ github.run_id }}:${{ github.sha }}
          OWNERSHIP_RELEASE_FENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_fence && 'true' || 'false' }}
        run: node scripts/ownership-control.mjs deployment-takeover
      # S1 contract (TOG-9907): /health must be 200 — that proves the
      # Container/DO bindings are wired (HTTP 1101 meant env.TWO_BOT was
      # undefined). /readyz is truthfully 503 while the gateway supervisor is
      # parked: S2 (TOG-9807) connects the shard, S3 (TOG-9808) wires the
      # pipeline, so only S2/S3 may turn this gate's 503 into a 200.
      # Never fake readyz success to pass CI.
      - name: Gate on /health + truthful /readyz
        env:
          STAGING_URL: ${{ vars.STAGING_WORKER_URL }}
        run: |
          set -euo pipefail
          test -n "$STAGING_URL" || {
            echo "STAGING_WORKER_URL repo variable is not set;"
            echo "ask the operator to add it (see docs/staging-soak.md), then re-run."
            exit 1
          }
          # Container cold start can take a minute; poll /health up to ~5 min.
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$STAGING_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "health 200 after ~$((i * 10))s"
              cat /tmp/health.json
              break
            fi
            echo "attempt $i: /health -> $code; waiting 10s"
            if [ "$i" = "30" ]; then
              echo "health never returned 200 (bindings still broken?)"
              cat /tmp/health.json || true
              exit 1
            fi
            sleep 10
          done
          # /readyz must answer with a component breakdown: 200 once S2/S3
          # meet contract, 503 while the shard is parked. Anything else
          # (500/1101/...) means the deploy is still broken.
          code=$(curl -s -o /tmp/readyz.json -w '%{http_code}' "$STAGING_URL/readyz" || true)
          echo "readyz -> $code"
          cat /tmp/readyz.json || true
          # Ownership refusal is also 503, but must NEVER pass this gate.
          node scripts/check-readyz.mjs "$code" /tmp/readyz.json

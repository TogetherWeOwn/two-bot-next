name: voice-synthetic

# Live staging voice synthetic (docs/voice-synthetic.md): a dedicated test bot
# joins the staging "Create a Lobby" creator and scripts/staging_voice_synthetic.py
# asserts the room lifecycle (template name at create, position below the
# creator, owner grants, status line, delete after leaving), so no human has to
# join to verify temp voice. Staging only; the script refuses any other guild.
#
# When it runs (owner policy 2026-10-11):
#   - after every deploy-staging (called from deploy-staging.yml, so a failing
#     synthetic fails the staging deploy and blocks promotion to production);
#   - every 6 hours to catch drift;
#   - by hand.
# On pull requests only the offline suite runs, and only when voice inputs
# change (check.yml, job-inputs `voice`): a PR's code is not on staging yet.
#
# Its only binding is the `voice-synthetic` environment secret
# TWO_VOICE_SYNTHETIC_BOT_TOKEN (main-only deployment branches, no reviewer:
# the test bot can only join voice and read channels in the staging guild).
# A missing token fails the run (required by default): an unconfigured voice
# gate must not read as green. Set the repo variable
# VOICE_SYNTHETIC_REQUIRED to `false` to restore the old "not configured"
# notice-and-pass behaviour while the test bot is being provisioned.
on:
  workflow_call:
    # The test token crosses the boundary by name. The control token stays in
    # the separate staging-environment job and never enters the consumer.
    inputs:
      staging_use_expires_at:
        type: string
        required: true
      staging_use_sha:
        type: string
        required: true
      staging_use_deployment:
        type: string
        required: true
    secrets:
      TWO_VOICE_SYNTHETIC_BOT_TOKEN:
        required: false
      # The caller must pass this name for the staging Environment to resolve
      # it in the authorization job; the consumer never references it.
      STAGING_OWNERSHIP_CONTROL_TOKEN:
        required: true
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions: {}

# Standalone owns the global window; a called run must never wait on its
# parent's lock. Inputs are workflow_call-only and come from deploy outputs.
concurrency:
  group: ${{ inputs.staging_use_expires_at != '' && format('staging-voice-consumer-{0}', github.run_id) || 'staging-lifecycle' }}
  cancel-in-progress: false

jobs:
  staging-window:
    name: authorize staging use before the consumer
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment: staging
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'staging-window') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 8
    outputs:
      expires_at: ${{ steps.begin.outputs.expires_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Acquire a finite standalone window and prove readiness
        id: begin
        if: inputs.staging_use_expires_at == ''
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
          STAGING_USE_MINUTES: '45'
          STAGING_USE_RECEIPT: ${{ runner.temp }}/staging-use.jsonl
        run: node wrangler/scripts/staging-use-pipeline.mjs begin
      - name: Assert the caller's exact window and readiness
        if: inputs.staging_use_expires_at != ''
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
          STAGING_USE_SHA: ${{ inputs.staging_use_sha }}
          STAGING_USE_DEPLOYMENT: ${{ inputs.staging_use_deployment }}
          STAGING_USE_EXPIRES_AT: ${{ inputs.staging_use_expires_at }}
          STAGING_USE_RECEIPT: ${{ runner.temp }}/staging-use.jsonl
        run: node wrangler/scripts/staging-use.mjs ready
      - name: Retain the acquisition or assertion receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-use-voice-start-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-use.jsonl
          if-no-files-found: error
          retention-days: 14

  # Called runs never release the parent's grant. The workflow lock covers
  # standalone begin, consumer and cleanup; native expiry covers runner loss.
  staging-use-release:
    needs: [staging-window, synthetic]
    if: inputs.staging_use_expires_at == '' && always() && github.ref == 'refs/heads/main' && needs.staging-window.outputs.expires_at != ''
    permissions:
      contents: read
    environment: staging
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'staging-use-release') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Release only this standalone run's window
        if: inputs.staging_use_expires_at == ''
        env:
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.STAGING_OWNERSHIP_CONTROL_TOKEN }}
          STAGING_USE_EXPIRES_AT: ${{ needs.staging-window.outputs.expires_at }}
          STAGING_USE_RECEIPT: ${{ runner.temp }}/staging-use-release.jsonl
        run: node wrangler/scripts/staging-use-pipeline.mjs finish
      - name: Retain the cleanup receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-use-voice-stop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-use-release.jsonl
          if-no-files-found: error
          retention-days: 14

  synthetic:
    name: staging voice synthetic
    needs: staging-window
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    environment: voice-synthetic
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'synthetic') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run the staging voice synthetic
        env:
          TWO_VOICE_SYNTHETIC_BOT_TOKEN: ${{ secrets.TWO_VOICE_SYNTHETIC_BOT_TOKEN }}
          VOICE_SYNTHETIC_REQUIRED: ${{ vars.VOICE_SYNTHETIC_REQUIRED }}
          TWO_STAGING_EMPTY_GRACE_SECONDS: ${{ vars.STAGING_EMPTY_GRACE_SECONDS || '60' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${TWO_VOICE_SYNTHETIC_BOT_TOKEN:-}" ]; then
            if [ "${VOICE_SYNTHETIC_REQUIRED:-true}" = "false" ]; then
              echo "::notice::voice synthetic not configured yet (no test bot token); see docs/voice-synthetic.md"
              exit 0
            fi
            echo "::error::TWO_VOICE_SYNTHETIC_BOT_TOKEN missing and the voice gate is required (set VOICE_SYNTHETIC_REQUIRED=false to opt out)"
            exit 1
          fi
          # Two retries absorb a transient gateway/REST hiccup and the documented
          # 95-139 s per-deploy gateway drop; three failures fail the run.
          for attempt in 1 2 3; do
            if python3 scripts/staging_voice_synthetic.py --evidence "voice-synthetic-$RUN_ID-$attempt.json"; then
              exit 0
            fi
            echo "::warning::voice synthetic attempt $attempt failed"
            [ "$attempt" = 3 ] || sleep 60
          done
          exit 1
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-synthetic-${{ github.run_id }}
          path: voice-synthetic-${{ github.run_id }}-*.json
          if-no-files-found: ignore
          retention-days: 14

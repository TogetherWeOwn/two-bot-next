name: future-clock probe (temporary)

# TEMPORARY evidence job for the fixture clock audit. Runs the DB-backed suite
# with both Postgres and the test binaries under libfaketime at 2027-10-31.
# Removed before merge; never a required check.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: future-clock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.head_ref == 'test/fixture-relative-clocks'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # +0d is the control: the same harness at today's clock. Only failures
    # unique to +365d are clock-sensitive.
    strategy:
      fail-fast: false
      matrix:
        offset: ['+0d', '+365d']
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      TWO_CUSTOM_COMMAND_TEST_CI: "1"
      TWO_AUTOMATION_TRANSFER_TEST_CI: "1"
      CARGO_PROFILE_DEV_DEBUG: 'line-tables-only'
      CARGO_PROFILE_TEST_DEBUG: 'line-tables-only'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_TEST_INCREMENTAL: 'false'
      TWO_LFG_TESTDB_CI: '1'
      TWO_GATEWAY_TEST_DATABASE_URL: postgresql://agent_test@localhost:5432/agent_test
      TWO_DATABASE_TLS: local-only
      # A shared offset, not an absolute start: '@' restarts each process's clock
      # at launch, skewing the test binaries against the long-running Postgres.
      FAKE_AT: ${{ matrix.offset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Debian's 0.9.10 package hangs Postgres 18 at startup; build a pinned
      # upstream commit instead (runner and Postgres image alike). Clock reads
      # only: with timer/sleep faking, Postgres statement/lock timeouts never
      # fire under a non-zero offset.
      - name: Build libfaketime and install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
          git clone -q https://github.com/wolfcw/libfaketime "$RUNNER_TEMP/libfaketime"
          git -C "$RUNNER_TEMP/libfaketime" checkout -q 9da91d97cc2b5bc08bcf420a34c9788d5946786c
          sed -i 's/ -Werror / /; s/ -DFAKE_PTHREAD -DFAKE_STAT -DFAKE_UTIME -DFAKE_SLEEP -DFAKE_TIMERS -DFAKE_INTERNAL_CALLS / /' "$RUNNER_TEMP/libfaketime/src/Makefile"
          make -s -C "$RUNNER_TEMP/libfaketime/src" libfaketimeMT.so.1
          echo "FT_LIB=$RUNNER_TEMP/libfaketime/src/libfaketimeMT.so.1" >> "$GITHUB_ENV"

      - name: Start faketime'd Postgres as agent-testdb
        run: |
          cat > /tmp/pg.Dockerfile <<'EOF'
          FROM postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722 AS build
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential git ca-certificates >/dev/null \
           && git clone -q https://github.com/wolfcw/libfaketime /src && cd /src && git checkout -q 9da91d97cc2b5bc08bcf420a34c9788d5946786c \
           && sed -i 's/ -Werror / /; s/ -DFAKE_PTHREAD -DFAKE_STAT -DFAKE_UTIME -DFAKE_SLEEP -DFAKE_TIMERS -DFAKE_INTERNAL_CALLS / /' src/Makefile \
           && make -s -C src libfaketimeMT.so.1
          FROM postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
          COPY --from=build /src/src/libfaketimeMT.so.1 /usr/local/lib/libfaketimeMT.so.1
          EOF
          docker build -q -t pg-faketime -f /tmp/pg.Dockerfile /tmp
          docker network create probe
          docker run -d --name agent-testdb --network probe -p 127.0.0.1:5432:5432 \
            --tmpfs /var/lib/postgresql:rw,size=2147483648 \
            -e POSTGRES_USER=agent_test -e POSTGRES_DB=agent_test -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e LD_PRELOAD=/usr/local/lib/libfaketimeMT.so.1 \
            -e FAKETIME="$FAKE_AT" -e FAKETIME_DONT_FAKE_MONOTONIC=1 \
            pg-faketime
          ip="$(docker inspect -f '{{(index .NetworkSettings.Networks "probe").IPAddress}}' agent-testdb)"
          echo "$ip agent-testdb" | sudo tee -a /etc/hosts
          for i in $(seq 1 60); do pg_isready -q -h agent-testdb -U agent_test -d agent_test && break; sleep 1; done
          docker logs agent-testdb 2>&1 | tail -5
          psql 'postgres://agent_test@agent-testdb:5432/agent_test' -X -At -c 'SELECT now()'
          for db in two_bot_test_ci two_next_backup_ci two_next_backup_publication_ci; do
            createdb -h agent-testdb -U agent_test "$db"
          done

      - name: Build test binaries (real clock)
        run: |
          python3 scripts/generate_command_reference.py
          cargo test --workspace --lib --bins --tests --features two-bot-core/db --locked --no-run \
            --message-format=json-render-diagnostics > "$RUNNER_TEMP/artifacts.json"

      # Cargo/rustc hang under libfaketime, so run each built test binary
      # directly (cwd and CARGO_MANIFEST_DIR as cargo test sets them). The
      # system-wide preload also reaches children spawned with env_clear().
      - name: Run suite at offset ${{ matrix.offset }}
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_ci
          TWO_RSVP_RUNTIME_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_ci
          TWO_BOT_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_next_backup_ci
          PAPERCLIP_RUN_SCRATCH_DIR: ${{ runner.temp }}/two-bot-backup-tests
        run: |
          echo "$FAKE_AT" | sudo tee /etc/faketimerc
          echo "$FT_LIB" | sudo tee /etc/ld.so.preload
          env -i date -u
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          skips = [
              'ticket_runtime::cursor_budget',
              'settings_jobs::tests::ops_overrides_acceptance_tests::',
              'voice_rooms::tests::name_filter_acceptance',
              'cli_write_failure_and_crash_never_publish_prune_or_upload_a_partial_dump',
              'seeded_aggregates_render_exactly_guild_scoped_and_read_only',
              'uses_one_above_i32_max_saturates_and_write_proceeds',
              'uses_u64_max_saturates_at_i32_max',
              'saturated_write_warns_with_identifiers_and_no_raw_counter',
              'normal_uses_round_trip_byte_identical',
              'exact_i32_max_writes_without_saturation_warn',
          ]
          args = [a for s in skips for a in ('--skip', s)]
          env = dict(os.environ)
          bins = []
          for line in pathlib.Path(os.environ['RUNNER_TEMP'], 'artifacts.json').read_text().splitlines():
              msg = json.loads(line)
              if msg.get('reason') == 'compiler-artifact' and msg.get('executable') and msg['profile']['test']:
                  bins.append((msg['executable'], os.path.dirname(msg['manifest_path']), msg['target']['name']))
          failed, timed_out = [], []
          for exe, cwd, name in bins:
              print(f'::group::{name} ({exe})', flush=True)
              try:
                  rc = subprocess.run([exe, *args], cwd=cwd, env=env | {'CARGO_MANIFEST_DIR': cwd}, timeout=600).returncode
              except subprocess.TimeoutExpired:
                  rc = 'timeout'
                  timed_out.append(name)
              print('::endgroup::', flush=True)
              if rc != 0 and rc != 'timeout':
                  failed.append(name)
              print(f'{name}: {rc}', flush=True)
          print(f'binaries: {len(bins)}, failed: {failed}, timed out: {timed_out}')
          sys.exit(1 if failed or timed_out else 0)
          PY

      - name: Remove the system-wide preload
        if: always()
        run: sudo rm -f /etc/ld.so.preload /etc/faketimerc

name: staging-migrate

# Manual, staging-only SQLx migration runner (TOG-11572). Never runs
# automatically and has no production path. Refuses before any DDL unless the
# operator names an independently reviewed source SHA that is already on main,
# the verified non-secret staging identity, and the recovery/ACL references.
# The per-mode bindings must already exist; this workflow never creates or
# changes credentials. `plan` reads only TWO_BOT_STAGING_PLAN_DATABASE_URL (a
# login holding only two_bot_migrator_ro, physically read-only) from the
# no-reviewer `staging-migrate-plan` environment and always runs; `apply`
# reads only TWO_BOT_STAGING_MIGRATOR_DATABASE_URL from the reviewed
# `staging-migrate-apply` environment and runs only for mode=apply, after a
# green plan. Both environments must exist before dispatch; a missing
# environment fails the job instead of leaking a binding.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan (read-only) or apply
        type: choice
        options: [plan, apply]
        default: plan
      source_sha:
        description: Full 40-char reviewed commit on main
        required: true
      staging_host:
        description: Pinned staging endpoint host, non-secret (binding must match; prod-like refused)
        required: true
      staging_database:
        description: Pinned staging database name, non-secret (binding must match; prod-like refused)
        required: true
      recovery_evidence_ref:
        description: Reference to approved recovery evidence (card/document, no URL secrets)
        required: true
      acl_plan_ref:
        description: Bare reference to the reviewed ACL sequence (card/document ref, no @/URL/whitespace; a non-bare ref is refused before any DDL)
        required: true
      expected_pending:
        description: Ascending comma-separated versions the reviewed plan listed (apply refuses unless it matches; empty when none pending)
        required: false
        default: ''
      plan_manifest_sha256:
        description: SHA-256 of the reviewed plan run's staging-migrate-manifest.json (apply refuses unless it matches the recomputed manifest on the same source_sha; empty for plan)
        required: false
        default: ''
      plan_run_id:
        description: Run id of the reviewed plan dispatch whose manifest the hash binds to (apply refuses unless present; empty for plan)
        required: false
        default: ''

permissions: {}

concurrency:
  group: staging-migrate
  cancel-in-progress: false

jobs:
  plan:
    name: staging-migrate (plan)
    permissions:
      contents: read
    # Dispatch from main only. The binding must be scoped to the
    # staging-migrate-plan environment (no reviewer: this job only reads;
    # main-only deployment branches) so a workflow edited on another branch
    # cannot read it.
    if: github.ref == 'refs/heads/main'
    environment: staging-migrate-plan
    # Runner routing (TOG-12339): same expression as every job in every
    # workflow; see the note on `check` in check.yml. A bare self-hosted
    # label would queue forever on the public repo.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'plan') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 30
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Source SHA must be exact and reachable from main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - name: Build runner
        run: cargo build -p two-bot-cutover --bin staging-migrate --locked
      - name: Run
        env:
          # Must already exist as a staging-migrate-plan environment secret; absent means refusal.
          # Read-only login (two_bot_migrator_ro): the runner refuses at validate when absent.
          TWO_BOT_STAGING_PLAN_DATABASE_URL: ${{ secrets.TWO_BOT_STAGING_PLAN_DATABASE_URL }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STAGING_HOST: ${{ inputs.staging_host }}
          STAGING_DATABASE: ${{ inputs.staging_database }}
          RECOVERY_REF: ${{ inputs.recovery_evidence_ref }}
          ACL_REF: ${{ inputs.acl_plan_ref }}
          EXPECTED_PENDING: ${{ inputs.expected_pending }}
        # `shell: bash` runs with `-eo pipefail`. The container's default `sh`
        # has no pipefail, so a refusal (exit 2) or failure (exit 1) piped into
        # `tee` left the job green with nothing migrated. `set -o pipefail`
        # is belt-and-braces for the same guarantee if the shell key is ever
        # re-targeted; the workflow-policy test pins both.
        shell: bash
        run: |
          set -o pipefail
          ./target/debug/staging-migrate --plan --source-sha "$SOURCE_SHA" \
            --staging-host "$STAGING_HOST" --staging-database "$STAGING_DATABASE" \
            --recovery-evidence-ref "$RECOVERY_REF" --acl-plan-ref "$ACL_REF" \
            --expected-pending "$EXPECTED_PENDING" \
            | tee staging-migrate-manifest.json
      - name: Upload plan manifest
        # The apply dispatch binds to this artifact by hash: the reviewer
        # reads plan_manifest_sha256/plan_run_id off this run, and the apply
        # runner refuses unless the hash matches on the same source_sha and
        # the artifact fetched back from that run carries the same hash
        # (provenance gate). Keep the 14-day retention: an expired artifact
        # fails the apply fetch step before any DDL.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-migrate-manifest
          path: staging-migrate-manifest.json
          if-no-files-found: error
          retention-days: 14
  apply:
    name: staging-migrate (apply)
    permissions:
      contents: read
      # Minimal grant for the provenance gate below: read-only fetch of the
      # producing plan run's manifest artifact through the GitHub API. Same
      # grant the deploy-production guard already carries for run gating; the
      # plan job keeps contents:read only because it produces the manifest.
      actions: read
    # Dispatch from main only, mode=apply only, and only after a green plan.
    # The binding must be scoped to the staging-migrate-apply environment
    # (required reviewer, main-only deployment branches) so a workflow edited
    # on another branch cannot read it.
    if: github.ref == 'refs/heads/main' && inputs.mode == 'apply'
    needs: plan
    environment: staging-migrate-apply
    # Runner routing (TOG-12339): same expression as every job in every
    # workflow; see the note on `check` in check.yml. A bare self-hosted
    # label would queue forever on the public repo.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'apply') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 30
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Source SHA must be exact and reachable from main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - name: Build runner
        run: cargo build -p two-bot-cutover --bin staging-migrate --locked
      - name: Fetch producing plan manifest
        # Provenance gate (TOG-15157 gap 2): the apply runner proves the bound
        # plan_manifest_sha256 came from the reviewed plan run by parsing this
        # artifact and refuses when it cannot. Resolving plan_run_id to the
        # run's uploaded artifact needs the job's actions:read grant; a wrong
        # run id, an expired/missing artifact or an API failure fails this
        # step, so the job fails before the runner -- and before any DDL --
        # ever starts. No continue-on-error: an unverified apply must not run.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-migrate-manifest
          path: producing-plan
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run
        env:
          # Must already exist as a staging-migrate-apply environment secret; absent means refusal.
          TWO_BOT_STAGING_MIGRATOR_DATABASE_URL: ${{ secrets.TWO_BOT_STAGING_MIGRATOR_DATABASE_URL }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STAGING_HOST: ${{ inputs.staging_host }}
          STAGING_DATABASE: ${{ inputs.staging_database }}
          RECOVERY_REF: ${{ inputs.recovery_evidence_ref }}
          ACL_REF: ${{ inputs.acl_plan_ref }}
          EXPECTED_PENDING: ${{ inputs.expected_pending }}
          PLAN_MANIFEST_SHA256: ${{ inputs.plan_manifest_sha256 }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        # `shell: bash` runs with `-eo pipefail`. The container's default `sh`
        # has no pipefail, so a refusal (exit 2) or failure (exit 1) piped into
        # `tee` left the job green with nothing migrated. `set -o pipefail`
        # is belt-and-braces for the same guarantee if the shell key is ever
        # re-targeted; the workflow-policy test pins both.
        shell: bash
        run: |
          set -o pipefail
          ./target/debug/staging-migrate --apply --source-sha "$SOURCE_SHA" \
            --staging-host "$STAGING_HOST" --staging-database "$STAGING_DATABASE" \
            --recovery-evidence-ref "$RECOVERY_REF" --acl-plan-ref "$ACL_REF" \
            --expected-pending "$EXPECTED_PENDING" \
            --plan-manifest-sha256 "$PLAN_MANIFEST_SHA256" --plan-run-id "$PLAN_RUN_ID" \
            --plan-manifest-path producing-plan/staging-migrate-manifest.json \
            | tee staging-migrate-manifest.json

name: pipeline benchmark

# Evidence job, deliberately not a required PR check. Reused by nightly.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/pipeline-benchmark.yml'
      - 'crates/discord/examples/pipeline_bench.rs'
      - 'scripts/*pipeline_bench*'
      - 'docs/pipeline-benchmark-baseline.json'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-pipeline-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    permissions:
      contents: read
    # Runner routing: see the note on `check` in check.yml.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'benchmark') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 20
    # Service DNS and loopback stay job-private; no shared host port is published.
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    services:
      agent-testdb:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: two_bot_test_pipeline_bench
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent_test -d two_bot_test_pipeline_bench"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_pipeline_bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Job-container prerequisites
        run: |
          # On hosted/overflow runners the job container's root does not own
          # the runner-owned checkout, so Git refuses it as dubious ownership
          # (same fix as check.yml prerequisites).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 >/dev/null
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.98.1" # Match rust-toolchain.toml; floating stable can drift.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pipeline-bench-${{ hashFiles('Cargo.lock') }}
      - name: Comparator and source-receipt regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test*pipeline_bench*.py' -v
      - name: Benchmark fixture and guard regressions (CI job container only)
        run: |
          cargo test -p two-bot-discord --example pipeline_bench --locked
          cargo test -p two-bot-testsupport --lib --locked
      - name: Build benchmark (CI job container only)
        run: cargo build -p two-bot-discord --example pipeline_bench --locked
      - name: Measure bounded synthetic pipeline
        run: |
          timeout 240s target/debug/examples/pipeline_bench > pipeline-benchmark.json
          python3 -m json.tool pipeline-benchmark.json
      - name: Compare committed baseline
        # The first evidence run bootstraps the measured baseline; no invented numbers.
        if: hashFiles('docs/pipeline-benchmark-baseline.json') != ''
        run: python3 scripts/compare_pipeline_bench.py pipeline-benchmark.json
      - name: Record actual source and separate PR head
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/pipeline_bench_revision.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pipeline-benchmark
          path: |
            pipeline-benchmark.json
            pipeline-benchmark-revision.txt
            pipeline-benchmark-pr-head.txt
          retention-days: 14

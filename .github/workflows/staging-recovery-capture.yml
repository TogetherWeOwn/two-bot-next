name: staging-recovery-capture
on:
  workflow_dispatch:
    inputs:
      recipient_certificate:
        description: Base64 DER public certificate for the encrypted recovery inventory
        required: true
        type: string

permissions: {}
concurrency:
  group: staging-recovery-capture
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment: staging-migrate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: python3 scripts/staging_recovery_capture.py
        env:
          TWO_BOT_STAGING_PLAN_DATABASE_URL: ${{ secrets.TWO_BOT_STAGING_PLAN_DATABASE_URL }}
          TWO_BOT_STAGING_HOST: ${{ vars.TWO_BOT_STAGING_HOST }}
          TWO_BOT_STAGING_DATABASE: ${{ vars.TWO_BOT_STAGING_DATABASE }}
          TWO_BOT_STAGING_BRANCH_ID: ${{ vars.TWO_BOT_STAGING_BRANCH_ID }}
          RECOVERY_RECIPIENT: ${{ inputs.recipient_certificate }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-recovery-capture
          path: staging-recovery.cms
          if-no-files-found: error
          retention-days: 14

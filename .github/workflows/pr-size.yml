# Pull-request size gate and advisory tally (TogetherWeOwn standard).
#
# The required pr-size-gate / gate check measures the diff and enforces the
# reviewability budget. It also refreshes the advisory size label on each PR
# run, using the same runner. A failed label write emits a warning and the
# gate still measures the diff.
#
# The weekly tally uses a separate read-only reusable workflow. GitHub
# validates reusable workflow permissions even for nested jobs that skip.

name: pr-size

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to label and gate now (blank runs the weekly tally)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One group per PR head commit for push, label and review events: the newest
  # event cancels the older run on the same commit (each run reads live PR
  # state), so verdicts for one commit never overlap. A new push is a new
  # commit and a new group, so its required gate never waits behind stale runs
  # (a queue held #2708's gate for over an hour on 2026-11-26), and a late
  # review on an old commit cannot cancel it. Manual dispatch has its own
  # group and never cancels.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.event_name }}-${{ github.event.pull_request.head.sha || 'manual' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_review' }}

jobs:
  pr-size-gate:
    name: pr-size-gate
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || inputs.pr_number != ''
    permissions:
      contents: read
      issues: write # Update size labels and ensure the size-exception label.
      pull-requests: write # Maintain advisory and required gate comments.
    uses: TogetherWeOwn/.github/.github/workflows/pr-size-gate.yml@649943c1ed8a1af8f8760e075f3923237dd72e50
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      advisory-label: true
      # The generated inventory is excluded. Hand-written migration SQL is counted.
      exclude-extra: "migrations.lock"

  pr-size-weekly:
    name: pr-size-weekly
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')
    permissions:
      contents: read
      issues: read # Shared weekly tally reads size labels from merged PRs.
      pull-requests: read # Shared weekly tally enumerates merged PRs.
    uses: TogetherWeOwn/.github/.github/workflows/pr-size-weekly.yml@649943c1ed8a1af8f8760e075f3923237dd72e50

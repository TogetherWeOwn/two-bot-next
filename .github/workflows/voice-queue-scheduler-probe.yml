name: Voice queue scheduler probe

# Disposable non-staging fixture. Do not merge this workflow.
on:
  push:
    branches: [test/voice-queue-scheduler-probe]

permissions: {}

jobs:
  holder:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    concurrency:
      group: voice-queue-probe-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - name: Hold the fixture lock until both waiters are pending
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
        run: |
          for ((probe = 0; probe < 60; probe++)); do
            jobs=$(gh api "$JOBS" --jq '.jobs[] | "\(.name)=\(.status)"')
            if grep -qx 'already-pending=pending' <<< "$jobs" &&
               grep -qx 'append=pending' <<< "$jobs"; then
              printf '%s\n' 'Both waiters are pending while the fixture lock is held.'
              exit 0
            fi
            if grep -qx 'already-pending=completed' <<< "$jobs"; then
              printf '%s\n' 'The original waiter completed before the lock was released.' >&2
              exit 1
            fi
            sleep 3
          done
          exit 1

  holder-ready:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Wait for the fixture lock to be held
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
        run: |
          for ((probe = 0; probe < 60; probe++)); do
            status=$(gh api "$JOBS" --jq '.jobs[] | select(.name == "holder") | .status')
            if [[ "$status" == in_progress ]]; then
              exit 0
            fi
            sleep 3
          done
          exit 1

  already-pending:
    needs: holder-ready
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: voice-queue-probe-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - run: ':'

  original-waiting:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Observe the required scheduler state
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
        run: |
          for ((probe = 0; probe < 60; probe++)); do
            jobs=$(gh api "$JOBS" --jq '.jobs[] | "\(.name)=\(.status)"')
            if grep -qx 'holder=in_progress' <<< "$jobs" && grep -qx 'already-pending=pending' <<< "$jobs"; then
              exit 0
            fi
            sleep 3
          done
          exit 1

  append:
    needs: original-waiting
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: voice-queue-probe-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
      queue: max
    steps:
      - run: ':'

  rerun-refusal:
    if: github.run_attempt != 1
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: exit 1

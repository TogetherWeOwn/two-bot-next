name: deploy-production-recovery

# The protected deploy-production caller holds the production lane for the
# release, including this call. Admission is generated by that caller, from
# the reviewed plan and its own provider and forward database readbacks.
on:
  workflow_call:
    inputs:
      candidate-sha: {type: string, required: true}
      pins: {type: string, required: true}
      plan-run-id: {type: string, required: true}
      database-host: {type: string, required: true}
      database-name: {type: string, required: true}
      database-branch-id: {type: string, required: true}
      stopped: {type: string, required: true}
      forward-artifact-id: {type: string, required: true}
      forward-archive-sha256: {type: string, required: true}
      candidate-worker: {type: string, required: true}

permissions: {}

env:
  RELEASE_SHA: ${{ inputs.candidate-sha }}
  RELEASE_PINS: ${{ inputs.pins }}
  RELEASE_PLAN_ID: ${{ inputs.plan-run-id }}
  RELEASE_STOPPED: ${{ inputs.stopped }}
  FORWARD_ARTIFACT_ID: ${{ inputs.forward-artifact-id }}
  FORWARD_ARCHIVE_SHA256: ${{ inputs.forward-archive-sha256 }}
  CANDIDATE_WORKER: ${{ inputs.candidate-worker }}
  PRODUCTION_HOST: ${{ inputs.database-host }}
  PRODUCTION_DATABASE: ${{ inputs.database-name }}
  PRODUCTION_BRANCH_ID: ${{ inputs.database-branch-id }}

jobs:
  fence:
    name: Confirm the protected production writer stopped
    if: github.repository_id == '1396224242' && github.ref == 'refs/heads/main' && github.ref_protected && github.run_attempt == 1 && github.event_name == 'workflow_dispatch' && github.workflow_ref == 'TogetherWeOwn/two-bot-next/.github/workflows/deploy-production.yml@refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: {name: production, deployment: false}
    permissions: &read_permissions
      contents: read
      actions: read # Authenticate the exact attempt and approved plan artifact.
      checks: read # Verify the independent App approval of the bound plan.
    outputs:
      stopped: ${{ steps.stop.outputs.ack }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false, fetch-depth: 1}
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, package-manager-cache: false}
      - name: Fence the exact serving pair at the pinned epoch
        id: stop
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_WORKER_URL: ${{ vars.PRODUCTION_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.PRODUCTION_OWNERSHIP_CONTROL_TOKEN }}
        run: python3 scripts/production_recovery_workflow.py fence
      - name: Retain the authenticated recovery stop
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release-recovery-stop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-release-recovery-stop.json
          if-no-files-found: error
          retention-days: 14

  inverse:
    name: Apply or reconcile the protected inverse
    needs: fence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-migrate-apply
    permissions: *read_permissions
    outputs:
      artifact_id: ${{ steps.result.outputs.artifact-id }}
      archive_sha256: ${{ steps.result.outputs.artifact-digest }}
    steps:
      - *checkout
      - name: Build the inverse runner from the trusted workflow commit
        run: cargo build -p two-bot-cutover --bin staging-migrate --locked
      - name: Verify the stopped fence and run the inverse
        env:
          GH_TOKEN: ${{ github.token }}
          STOPPED_FENCE_ACK: ${{ needs.fence.outputs.stopped }}
          TWO_BOT_PRODUCTION_MIGRATOR_DATABASE_URL: ${{ secrets.TWO_BOT_PRODUCTION_MIGRATOR_DATABASE_URL }}
        run: python3 scripts/production_recovery_workflow.py inverse "$GITHUB_WORKSPACE/target/debug/staging-migrate" "$RUNNER_TEMP/production-inverse"
      - name: Upload the verified inverse result
        id: result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release-inverse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-inverse/production-release-inverse.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  restore:
    name: Restore the prior pair behind the verified fence
    needs: [fence, inverse]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions: *read_permissions
    steps:
      - *checkout
      - *node
      - name: Authenticate the protected result and restore the exact pair
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_WORKER_URL: ${{ vars.PRODUCTION_WORKER_URL }}
          OWNERSHIP_CONTROL_TOKEN: ${{ secrets.PRODUCTION_OWNERSHIP_CONTROL_TOKEN }}
          STOPPED_FENCE_ACK: ${{ needs.fence.outputs.stopped }}
          ARTIFACT_ID: ${{ needs.inverse.outputs.artifact_id }}
          ARCHIVE_SHA256: ${{ needs.inverse.outputs.archive_sha256 }}
        run: python3 scripts/production_recovery_workflow.py restore
      - name: Retain the exact restored pair and stable readiness
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release-restored-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-release-restored.json
          if-no-files-found: error
          retention-days: 14

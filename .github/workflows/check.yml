name: check

# Required on main from the first Rust code (see README Contributing):
# fmt --check, clippy with -D warnings, and the test suite.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Compile optional stores and run their non-network safety tests too.
      # Live store tests remain explicitly ignored (agent-testdb only).
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --features two-bot-core/db -- -D warnings

      - name: cargo test
        run: cargo test --workspace --features two-bot-core/db --locked

      - name: settings database regressions (CI service only)
        run: cargo test -p two-bot-cutover --test settings_db --locked -- --ignored

      # `check all` reads Cargo.lock by default (no --locked flag exists).
      # deny.toml's allow-list is verified tight: no unmatched allowances.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check all

  community-db:
    name: community db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TWO_TEST_DATABASE_URL: postgres://agent_test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - name: Check feature-gated community stores
        run: cargo clippy -p two-bot-core --all-targets --features db --locked -- -D warnings
      - name: Test presence, scorecard and inactivity ledgers on ephemeral Postgres
        run: |
          cargo test -p two-bot-core --features db --locked --lib community_store
          cargo test -p two-bot-core --features db --locked --lib presence_store
          cargo test -p two-bot-core --features db --locked --lib inactivity_store

  worker:
    name: worker check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wrangler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wrangler/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # TOG-9907: named envs do not inherit bindings; fail if any [env.*]
      # omits the Container/DO/exports/vars wiring (staging HTTP 1101).
      - name: check env bindings are explicit
        run: python3 scripts/check-env-bindings.py wrangler.toml

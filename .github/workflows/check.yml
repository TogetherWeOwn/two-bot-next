name: check

# Required on main from the first Rust code (see README Contributing):
# fmt --check, clippy with -D warnings, and the test suite.

on:
  pull_request:
  push:
    branches: [main]
  # Dispatched by the release workflow (TOG-10035) on release-please branches:
  # PRs opened with GITHUB_TOKEN trigger no workflows, so the required `check`
  # / `worker check` would never run on the release PR without this path.
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: PR SBOM dry-run
    # Same inventory and gates as releases, but no publishing job or secrets.
    # The reusable SBOM workflow lives in sbom.yml: supply-chain.yml is
    # main's folded pr-lint + gitleaks gate (TOG-11810) and has no
    # workflow_call trigger, so it cannot be called with `uses:`.
    # A called workflow can only narrow the caller grant; with the default-deny
    # top level it would otherwise check out this private repo with no token.
    permissions:
      contents: read
    uses: ./.github/workflows/sbom.yml # zizmor: ignore[self-repository] same-repo reusable call, pinned by test_workflows
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  check:
    name: check
    permissions:
      contents: read
    needs: [self-role-store, supply-chain, parity-docs, job-inputs]
    # Failed, skipped or cancelled dependencies must not make check appear green.
    if: ${{ always() }}
    # Runner routing (TOG-12339). Every job in every workflow uses this
    # expression with its own job id; scripts/test-runner-routing.py pins it.
    # - Public repo: GitHub-hosted ubuntu-latest, free. The org runner group
    #   refuses public repos, so a self-hosted label would queue forever. An
    #   event payload without `repository` (schedule) also lands here.
    # - Private repo: [self-hosted, two-selfhosted], unless repo vars
    #   CI_OVERFLOW_RUNNER (JSON runs-on, e.g. ["ubuntu-latest"]),
    #   CI_OVERFLOW_JOBS (JSON job ids) and CI_OVERFLOW_EVENTS (JSON event
    #   names) all select the job (TOG ops, 2026-10-01). Flip back without a PR
    #   by deleting CI_OVERFLOW_RUNNER. Hosted minutes then come from the
    #   included allowance; an rbx1 guard reverts at 45k.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'check') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: ${{ github.event_name == 'push' && 60 || 30 }}
    # Self-hosted runners share one Docker host, so a published 5432 collides
    # across concurrent jobs. A job container gets its own network namespace:
    # the service resolves as agent-testdb:5432 and loopback is job-private.
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    env:
      CARGO_TERM_COLOR: always
      # Disk hygiene for hosted overflow runners (TOG-12134): the integration
      # link step (`cargo test --workspace --test '*'`) links ~70 test
      # binaries and exhausted the job-container overlay (98 MB left, rust-lld
      # bus error on two consecutive main heads). Line tables keep failure
      # backtraces useful while cutting binary size; codegen, debug
      # assertions and test semantics are unchanged. `cargo test` compiles
      # under the `test` profile, so both profiles are pinned.
      CARGO_PROFILE_DEV_DEBUG: 'line-tables-only'
      CARGO_PROFILE_TEST_DEBUG: 'line-tables-only'
      # Incremental artifacts multiply with ~70 linked test binaries; a cold
      # CI link does not reuse them, so skip writing them (TOG-12134).
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_TEST_INCREMENTAL: 'false'
      TWO_LFG_TESTDB_CI: '1'
      TWO_GATEWAY_TEST_DATABASE_URL: postgresql://agent_test@localhost:5432/agent_test
      # CI service hosts only; deployed processes default to `required`
      # (docs/database-tls.md).
      TWO_DATABASE_TLS: local-only
    services:
      agent-testdb:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: agent_test
          # Ephemeral CI service only; tests explicitly use an empty password.
          # Slice scratch databases are created in the prepare step below.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The migration guard reads PR base/push-before blobs, including the lock.
          fetch-depth: 0

      - name: Job-container prerequisites (loopback forward to agent-testdb)
        run: |
          # On hosted/overflow runners the job container's root does not own the
          # runner-owned checkout, so Git refuses it as dubious ownership.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 python3-pip postgresql-client socat >/dev/null
          # Disk hygiene for hosted overflow runners (TOG-12134): the package
          # lists stay on the job-container overlay otherwise.
          rm -rf /var/lib/apt/lists/*
          # Tests that pin 127.0.0.1/localhost:5432 reach the service through
          # this job-private forward.
          nohup setsid socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:agent-testdb:5432 >/dev/null 2>&1 &
          for i in $(seq 1 30); do pg_isready -q -h 127.0.0.1 -U agent_test -d agent_test && exit 0; sleep 1; done
          exit 1

      - name: Selection note (dependency-aware skip)
        env:
          SEL_RUST: ${{ needs.job-inputs.outputs.rust }}
          SEL_WORKER: ${{ needs.job-inputs.outputs.worker }}
          SEL_PARITY: ${{ needs.job-inputs.outputs.parity }}
        run: |
          printf 'job-inputs: rust=%s worker=%s parity=%s\n' \
            "$SEL_RUST" "$SEL_WORKER" "$SEL_PARITY"

      - name: require parity docs to pass
        if: needs.parity-docs.result != 'success' && needs.job-inputs.outputs.parity != 'false'
        run: exit 1

      - name: require self-role store tests to pass
        if: needs.self-role-store.result != 'success' && needs.job-inputs.outputs.rust != 'false'
        run: exit 1

      - name: require supply-chain gate to pass
        if: needs.supply-chain.result != 'success'
        run: exit 1

      - name: Check migration numbering and immutability
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-check-migrations.py
          python3 scripts/check-migrations.py --base-ref "$MIGRATION_BASE"

      - name: Install pinned static audit tools
        run: |
          python3 -m pip --isolated --disable-pip-version-check --no-cache-dir install --only-binary=:all: --no-deps --target "$RUNNER_TEMP/zizmor" 'zizmor==1.30.1' 'PyYAML==6.0.3'

      - name: Source-level CI gate regressions
        run: PYTHONPATH="$RUNNER_TEMP/zizmor" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Reject hard-coded source snowflakes
        run: python3 scripts/ci/check-src-snowflakes.py

      - name: Verify CODEOWNERS syntax and coverage
        run: python3 scripts/ci/verify-codeowners.py

      - name: Audit GitHub Actions workflows
        # Offline static audits need no GitHub credentials or security-events writes.
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --offline --strict-collection --no-progress .github/workflows'

      - name: offline build-cache safety regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_cargo_cache.py' -v

      - name: parity soak checklist coverage (offline)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_soak_checklist.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_soak_checklist.py' -v

      - name: Validate voice template fixtures (hermetic, no renderer)
        run: |
          python3 tests/voice_templates/validate.py
          python3 -m unittest discover -s tests/voice_templates -p 'test_*.py' -v

      # `check all` reads Cargo.lock by default (no --locked flag exists).
      # deny.toml's allow-list is verified tight: no unmatched allowances.
      # Runs before the toolchain install and every compile/link step
      # (TOG-12134): the deny image ships its own toolchain and rustup-syncs
      # the pinned one, so it must run while the disk is at its freest.
      - name: cargo-deny
        if: needs.job-inputs.outputs.rust != 'false'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check all

      - name: Install Rust toolchain
        if: needs.job-inputs.outputs.rust != 'false'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Fail-fast (TOG-12055): cheap lint/format/guard checks run before the
      # ~4 GiB cargo cache restore, so a failure skips the big download. The
      # Docker layer check is split: the offline shape check fails fast here;
      # the real locked `cargo fetch` stays after the restore (below) so it
      # reuses the warm registry cache instead of fetching cold.
      - name: cargo fmt --check
        if: needs.job-inputs.outputs.rust != 'false'
        run: cargo fmt --all -- --check

      - name: Prevent raw secrets under derived Debug
        run: |
          python3 scripts/check-secret-debug.py --test
          python3 scripts/check-secret-debug.py

      - name: Verify Docker dependency layer (offline)
        run: python3 scripts/test-docker-deps.py

      # TOG-11810: dependency build cache. The raw ~4 GiB target/ upload
      # blew the 30-minute PR timeout (#147); rust-cache stores ~/.cargo and
      # the dependency builds in target/, stripping workspace crates, so
      # restore/save stay small. The key includes the job id (no shared-key),
      # so this job's entry is separate from `tickets postgres`. Restore on
      # every run; save only on pushes to main (a PR-scoped entry is
      # unreadable by other PRs, so a PR upload is pure waste).
      - name: Restore cargo cache
        if: needs.job-inputs.outputs.rust != 'false'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo
          save-if: ${{ github.event_name == 'push' }}

      # Real locked fetch: needs the warm registry cache restored above, so it
      # stays here. The offline layer-shape check already ran before the
      # restore (TOG-12055), so a drifted Dockerfile fails before any download.
      - name: Verify Docker dependency layer (locked fetch)
        if: needs.job-inputs.outputs.rust != 'false'
        run: python3 scripts/test-docker-deps.py --cargo

      # TOG-12134: cheap static guard, adopted from main. The fmt and
      # secret-Debug checks already ran before the restore (TOG-12055), so
      # main's post-restore duplicates of them are dropped here — no coverage
      # change, same steps run once and earlier.
      - name: Verify check job disk hygiene
        run: python3 scripts/test-check-disk-hygiene.py

      # Compile optional stores and run their safety and scratch-DB tests too.
      # Onboarding/sticky live tests remain explicitly ignored by default.
      - name: cargo clippy -D warnings
        if: needs.job-inputs.outputs.rust != 'false'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Prepare isolated test databases
        if: needs.job-inputs.outputs.rust != 'false'
        run: createdb -h agent-testdb -U agent_test two_bot_test_ci

      # Preserve cargo test's default unit/binary, integration and doc targets.
      # Migrated suites create/drop unique databases; this bootstrap is not reset.
      - name: cargo test (unit and binary, including RSVP store)
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_ci
        run: cargo test --workspace --lib --bins --features two-bot-core/db --locked

      - name: cargo test (integration, including website acceptance)
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_ci
        run: cargo test --workspace --test '*' --features two-bot-core/db --locked

      - name: Native v3 and real backup CLI regressions (CI service only)
        if: needs.job-inputs.outputs.rust != 'false'
        run: |
          export PAPERCLIP_RUN_SCRATCH_DIR
          PAPERCLIP_RUN_SCRATCH_DIR=$(mktemp -d "$RUNNER_TEMP/backup-regressions.XXXXXX")
          db="two_next_backup_publication_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          createdb -h agent-testdb -U agent_test "$db"
          trap 'dropdb -h agent-testdb -U agent_test --if-exists "$db"; rm -rf "$PAPERCLIP_RUN_SCRATCH_DIR"' EXIT
          export TWO_BOT_TEST_DATABASE_URL="postgres://agent_test:@agent-testdb:5432/$db"
          cargo build -p two-bot --locked
          export TWO_BOT_TEST_BACKUP_BIN="$PWD/target/debug/two-bot"
          cargo test -p two-bot-core --features db --test backup_roundtrip --test backup_dump_publication --locked -- --nocapture --test-threads=1
          # The shipped monthly drill on the complete migrated schema (TOG-11804).
          export TWO_TEST_DATABASE_URL=postgres://agent_test:@agent-testdb:5432/two_bot_test_ci
          cargo test -p two-bot-core --features db --test backup_schema_roundtrip --locked shipped_backup_and_restore_drill -- --nocapture --test-threads=1

      # Reuse the exact feature/target graph above so this measures execution,
      # not a second compilation. Property tests are pure fixtures (64 cases).
      - name: property tests stay under 30 seconds
        if: needs.job-inputs.outputs.rust != 'false'
        run: |
          start=$SECONDS
          cargo test --workspace --lib --bins --test '*' --features two-bot-core/db --locked property_
          elapsed=$((SECONDS - start))
          printf 'Property suite: %s seconds (budget <30)\n' "$elapsed"
          test "$elapsed" -lt 30

      - name: cargo test (docs)
        if: needs.job-inputs.outputs.rust != 'false'
        run: cargo test --workspace --doc --features two-bot-core/db --locked

      - name: Measure metrics RSS (local fixtures only)
        if: needs.job-inputs.outputs.rust != 'false'
        run: cargo run -p two-bot-core --example metrics_rss --locked

      - name: audit database regressions (CI service only)
        if: needs.job-inputs.outputs.rust != 'false'
        run: cargo test -p two-bot-core --features db --test audit_store --test audit_service --test containment_store --locked -- --ignored

      - name: LFG store regressions (CI service container only)
        if: needs.job-inputs.outputs.rust != 'false'
        run: >-
          cargo test -p two-bot-core --features db --locked lfg_store:: -- --ignored --test-threads=1

      - name: leveling gateway and interaction integration (CI service only)
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_ci
        run: cargo test -p two-bot-discord --features db --locked --test leveling_runtime -- --ignored --test-threads=1

      - name: onboarding prompt store regressions (CI service only)
        run: cargo test -p two-bot-core --features db --test onboarding_store --locked -- --ignored

      - name: onboarding shared runtime acceptance (mock Discord and CI service only)
        run: cargo test -p two-bot --locked onboarding_ -- --include-ignored

      - name: automod durable dedupe (CI service container only)
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          AUTOMOD_CI_TESTDB: '1'
        run: cargo test -p two-bot-core --features db --locked --test automod_store --test automod_preserved_replay -- --ignored

      - name: leveling Postgres parity tests
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          TWO_LEVELING_TEST_CI: '1'
        run: cargo test -p two-bot-core --features db --locked --test leveling_store -- --ignored

      - name: Raid cohort query (CI service container only)
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/agent_test
        run: cargo test -p two-bot-cutover --test raid_list_db --locked -- --ignored

      - name: Reengagement list query (CI service container only)
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/agent_test
        run: cargo test -p two-bot-cutover --test reengagement_list_db --locked -- --ignored

      - name: settings database regressions (CI service only)
        if: needs.job-inputs.outputs.rust != 'false'
        run: cargo test -p two-bot-cutover --test settings_db --locked -- --ignored

      - name: voice room store regressions (CI service only)
        if: needs.job-inputs.outputs.rust != 'false'
        run: cargo test -p two-bot-cutover --test voice_rooms_store --locked -- --ignored

      - name: Docker dependency-layer manifests (offline)
        run: python3 scripts/check-docker-manifests.py

      - name: Store Postgres integration (isolated CI schemas)
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          TEST_DATABASE_URL: postgresql://agent_test@localhost:5432/postgres
        run: cargo test -p two-bot-store --locked --test postgres --test journal --test membership_pg -- --ignored

      - name: legacy copy acceptance (two owned databases on CI service only)
        if: needs.job-inputs.outputs.rust != 'false'
        run: cargo test -p two-bot-cutover --test legacy_copy_db --locked -- --ignored

      - name: Legacy verification acceptance (two disposable CI databases)
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test@agent-testdb:5432/agent_test
        run: cargo test -p two-bot-cutover --test legacy_verify_db --locked -- --ignored

      - name: Staging migration runner acceptance (real SQLx, disposable CI database)
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test@agent-testdb:5432/agent_test
        run: cargo test -p two-bot-cutover --test staging_migrate_db --locked -- --ignored

      - name: channel moderation store clippy
        if: needs.job-inputs.outputs.rust != 'false'
        run: cargo clippy -p two-bot-core --features db --all-targets --locked -- -D warnings

      # Only this slice's tests activate their test-container guard here.
      - name: channel moderation domain and store tests
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test@agent-testdb:5432/agent_test
        run: cargo test -p two-bot-core --features db --locked channel_moderation -- --include-ignored

      - name: Internal channel moderation executor (mock REST and CI service only)
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test@agent-testdb:5432/agent_test
        run: cargo test -p two-bot-discord --features db --locked --test internal_channel_moderation -- --include-ignored

      - name: Internal-member durable store regressions (CI service only)
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_ci
        run: cargo test -p two-bot-discord --features db --locked --test internal_member_store -- --ignored

      - name: Internal event executor mirror acceptance (CI service only)
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/agent_test
        run: cargo test -p two-bot-discord --features db --locked --test internal_events -- --include-ignored

      - name: Gateway restart and transaction tests (CI service only)
        if: needs.job-inputs.outputs.rust != 'false'
        run: cargo test -p two-bot --locked gateway_tests -- --ignored --test-threads=1

      - name: Durable Discord send admission (isolated DBs and mock HTTP only)
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_ci
        run: |
          cargo test -p two-bot-core --features db --test send_admission --locked -- --ignored
          cargo test -p two-bot-discord --features db-tests --lib --locked admission_ -- --ignored
          cargo test -p two-bot-cutover --test send_admission --locked -- --ignored

      - name: Command runtime acceptance tests (sticky, feeds and leveling, CI service only)
        if: needs.job-inputs.outputs.rust != 'false'
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_ci
        run: cargo test -p two-bot --locked command_runtime_tests -- --ignored --test-threads=1

      - name: Real binary lifecycle acceptance (CI service only, under 60 s)
        if: needs.job-inputs.outputs.rust != 'false'
        run: timeout 60s cargo test -p two-bot --locked --test alive -- --ignored --nocapture

  parity-docs:
    name: parity docs
    permissions:
      contents: read
    needs: [job-inputs]
    # Skip when the selector sees no parity inputs; the `check`
    # aggregator only enforces this job when parity was selected.
    if: needs.job-inputs.outputs.parity != 'false'
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'parity-docs') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline parity guard regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_parity_baseline.py' -v
      - name: Fetch public legacy history (no credentials)
        run: |
          git -c credential.helper= clone --bare https://github.com/TogetherWeOwn/two-bot.git "$RUNNER_TEMP/legacy.git"
          start=$(python3 -c 'import json; print(json.load(open("docs/parity-baseline.json"))["historyStart"])')
          git -C "$RUNNER_TEMP/legacy.git" -c credential.helper= fetch origin "$start"
      - name: Check baseline ancestry, complete ledger and permalink targets
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_parity_baseline.py --legacy-repo "$RUNNER_TEMP/legacy.git"

  self-role-store:
    name: self-role store leases
    permissions:
      contents: read
    needs: [job-inputs]
    # Skip when the selector sees no Rust inputs; the `check`
    # aggregator only enforces this job when rust was selected.
    if: needs.job-inputs.outputs.rust != 'false'
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'self-role-store') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 30
    # A job container resolves service names directly. The test's fixed
    # agent-testdb endpoint cannot fall back to an inherited DATABASE_URL.
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    services:
      agent-testdb:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: agent_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: stable
      - name: self-role claim, renewal, recovery and fencing tests
        run: cargo test -p two-bot-cutover --test self_role_store --locked -- --ignored
      - name: self-role runtime admission and immutable snapshots (mock REST and isolated schema)
        run: >-
          cargo test -p two-bot --locked self_role_runtime:: -- --include-ignored --test-threads=1

  # Dependency-aware selector for the test jobs (TOG-12057): generalizes the
  # TOG-12056 container-inputs pattern to the whole matrix. PRs that touch
  # only worker UI or unrelated docs skip the ~30-minute Rust suite; Rust-only
  # PRs skip the worker job. No `paths:` filter on the workflow: that would
  # skip the whole workflow including the always-reporting `check`
  # aggregator. Needs nothing so it starts immediately and never blocks on
  # the test jobs. Fail-closed end to end: the shell step defaults to
  # rust/worker/parity=true, so an undecidable diff, missing SHAs, a
  # classifier error or any non-PR event selects full jobs, and every gated
  # step uses `!= 'false'` so missing outputs run rather than skip. Push to
  # main always selects everything, so release-candidate and staging
  # validation never lose coverage.
  job-inputs:
    name: job inputs changed
    permissions:
      contents: read
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'job-inputs') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      worker: ${{ steps.select.outputs.worker }}
      parity: ${{ steps.select.outputs.parity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base/head SHAs must resolve locally for the diff below.
          fetch-depth: 0
          persist-credentials: false
      - name: Offline job-inputs regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_job_inputs.py' -v
      - name: Select jobs or run all
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rust=true worker=true parity=true
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] \
            && result=$(python3 scripts/job-inputs.py \
              --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA"); then
            rust=$(printf '%s' "$result" | sed -n 's/^rust=//p')
            worker=$(printf '%s' "$result" | sed -n 's/^worker=//p')
            parity=$(printf '%s' "$result" | sed -n 's/^parity=//p')
            rust=${rust:-true} worker=${worker:-true} parity=${parity:-true}
          fi
          printf 'job-inputs: rust=%s worker=%s parity=%s (event=%s)\n' \
            "$rust" "$worker" "$parity" "${{ github.event_name }}"
          printf 'rust=%s\nworker=%s\nparity=%s\n' \
            "$rust" "$worker" "$parity" >>"$GITHUB_OUTPUT"

  # Dependency-aware selector for the container job (TOG-12056): PRs that
  # touch only docs, worker UI or unrelated CI tooling skip the ~15-minute
  # amd64 release build. No `paths:` filter on the workflow: that would
  # skip the whole workflow including required checks. Needs nothing so it
  # starts immediately and never blocks on the test jobs. Fail-closed end
  # to end: the shell step defaults to build=true, so an undecidable diff,
  # missing SHAs, a classifier error or any non-PR event selects a full
  # build. Skipped PR runs deliberately write no image cache: the GHA
  # cache is PR-safe by platform ref-scoping (PR restores base/main, PR
  # writes stay on the merge ref), so no scope-string change is needed.
  container-inputs:
    name: container inputs changed
    permissions:
      contents: read
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'container-inputs') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base/head SHAs must resolve locally for the diff below.
          fetch-depth: 0
          persist-credentials: false
      - name: Offline container-inputs regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_container_inputs.py' -v
      - name: Select image build or skip
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          build=true
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] \
            && result=$(python3 scripts/container-inputs.py \
              --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA"); then
            build="$result"
          fi
          printf 'container-inputs: build=%s (event=%s)\n' \
            "$build" "${{ github.event_name }}"
          printf 'build=%s\n' "$build" >>"$GITHUB_OUTPUT"

  container:
    name: container smoke
    permissions:
      contents: read
    needs: container-inputs
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'container') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 30
    env:
      IMAGE: two-bot-next:smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Offline smoke-test regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_container_smoke.py' -v
      # A skipped build still reports success: the offline tests above ran,
      # and container smoke is not a required check, so the check stays
      # green without hiding anything the branch protection demands.
      - name: Skip note (no image inputs changed)
        if: needs.container-inputs.outputs.build != 'true'
        env:
          BUILD_SELECTION: ${{ needs.container-inputs.outputs.build }}
        run: |
          printf 'Skipping the runtime image build: no image inputs changed.\n'
          printf 'Selector output: build=%s\n' "$BUILD_SELECTION"
      - name: Set up BuildKit
        if: needs.container-inputs.outputs.build == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build runtime image (local only)
        id: build
        if: needs.container-inputs.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=two-bot-runtime-amd64
          cache-to: type=gha,mode=max,scope=two-bot-runtime-amd64
      - name: Runtime contract and size budgets
        if: needs.container-inputs.outputs.build == 'true'
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: python3 scripts/container-smoke.py "$IMAGE_ID"
      - name: Prove deliberate budget breakage fails
        if: needs.container-inputs.outputs.build == 'true'
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          for budget in image binary; do
            log="$RUNNER_TEMP/container-negative-$budget.log"
            if python3 scripts/container-smoke.py "$IMAGE_ID" "--$budget-max-bytes" 1 >"$log" 2>&1; then
              printf 'FAIL: deliberate %s budget violation was accepted\n' "$budget"
              exit 1
            fi
            grep -F "exceeds size budget" "$log"
            printf 'PASS: deliberate %s budget violation rejected\n' "$budget"
          done
      - name: Remove only this run's smoke image
        if: ${{ always() }}
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            docker image rm "$IMAGE"
          fi

  community-db:
    name: community db
    permissions:
      contents: read
    needs: [job-inputs]
    # Skip when the selector sees no Rust inputs (not a required check).
    if: needs.job-inputs.outputs.rust != 'false'
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'community-db') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 15
    # Self-hosted runners share one Docker host, so a published 5432 collides
    # across concurrent jobs. A job container gets its own network namespace:
    # the service resolves as agent-testdb:5432 and loopback is job-private.
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    services:
      agent-testdb:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent_test -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TWO_TEST_DATABASE_URL: postgres://agent_test@agent-testdb:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      - name: Check feature-gated community stores
        run: cargo clippy -p two-bot-core --all-targets --features db --locked -- -D warnings
      - name: Test presence, scorecard and inactivity ledgers on ephemeral Postgres
        run: |
          cargo test -p two-bot-core --features db --locked --lib community_store
          cargo test -p two-bot-core --features db --locked --lib presence_store
          cargo test -p two-bot-core --features db --locked --lib inactivity_store

  feeds-db:
    name: feeds db check
    permissions:
      contents: read
    needs: [job-inputs]
    # Skip when the selector sees no Rust inputs (not a required check).
    if: needs.job-inputs.outputs.rust != 'false'
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'feeds-db') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 15
    # Self-hosted runners share one Docker host, so a published 5432 collides
    # across concurrent jobs. A job container gets its own network namespace:
    # the service resolves as agent-testdb:5432 and loopback is job-private.
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    env:
      TWO_TEST_DATABASE_URL: postgres://agent_test@agent-testdb:5432/agent_test
    services:
      agent-testdb:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: agent_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy -p two-bot-core --all-targets --features db --locked -- -D warnings
      - run: cargo test -p two-bot-core --features db --test feeds --locked
      - run: cargo test -p two-bot-core --features db --test feeds_store --locked -- --ignored

  tickets-postgres:
    name: tickets postgres
    permissions:
      contents: read
    needs: [job-inputs]
    # Skip when the selector sees no Rust inputs (not a required check).
    if: needs.job-inputs.outputs.rust != 'false'
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'tickets-postgres') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 15
    # Service DNS stays inside this job's network; never publish a shared port.
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    services:
      agent-testdb:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: agent_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TICKET_TEST_DB_HOST: agent-testdb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: stable
      # TOG-11810: dependency build cache, as in the `check` job. The key
      # includes the job id, so this job keeps its own entry (it builds a
      # different dependency set); saved only on pushes to main.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo
          save-if: ${{ github.event_name == 'push' }}
      - name: Ticket lifecycle and migration integration tests
        run: cargo test -p two-bot-cutover --locked --test tickets_store -- --ignored
      - name: Ticket shared router and mock Discord lifecycle acceptance
        run: >-
          cargo test -p two-bot --locked --bin two-bot ticket_runtime:: -- --include-ignored

  worker:
    name: worker check
    permissions:
      contents: read
    needs: [job-inputs]
    # Skip when the selector sees no worker inputs (not a required check).
    if: needs.job-inputs.outputs.worker != 'false'
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'worker') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wrangler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wrangler/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # TOG-9907: named envs do not inherit bindings; fail if any [env.*]
      # omits the Container/DO/exports/vars wiring (staging HTTP 1101).
      - name: check env bindings are explicit
        run: |
          python3 scripts/check-env-bindings.py wrangler.toml
          python3 scripts/test-env-bindings.py
      - name: Verify frozen legacy registry export preconditions
        run: node --test ../scripts/test-export-legacy-registry.mjs
      - name: Verify PR lint event and dispatch paths
        run: python3 ../scripts/test-pr-lint.py
      - name: Verify secret-scan trigger and concurrency surface
        run: python3 ../scripts/test-secret-scan.py
      - name: Verify production deploy guards
        run: python3 ../scripts/test-deploy-production.py
      - name: Verify release reconciliation retries
        run: python3 ../scripts/test-release-retry.py
      - name: Verify staging rollout provenance (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_rollout.py -v
      - name: Verify runner routing for every workflow job
        run: python3 ../scripts/test-runner-routing.py
      - name: Verify offline release lifecycle
        # Match the library bundled by the pinned release action, in an isolated
        # API-double fixture with lifecycle scripts disabled and no write token.
        run: | # zizmor: ignore[adhoc-packages] pinned offline release fixture only
          npm install --prefix "$RUNNER_TEMP/release-fixture" --ignore-scripts --no-audit --no-fund release-please@17.6.0
          NODE_PATH="$RUNNER_TEMP/release-fixture/node_modules" node ../scripts/test-release.cjs
          NODE_PATH="$RUNNER_TEMP/release-fixture/node_modules" node ../scripts/test-release-publication.cjs

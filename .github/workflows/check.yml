    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'feeds-db') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 15
    # Self-hosted runners share one Docker host, so a published 5432 collides
    # across concurrent jobs. A job container gets its own network namespace:
    # the service resolves as agent-testdb:5432 and loopback is job-private.
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    env:
      TWO_TEST_DATABASE_URL: postgres://agent_test@agent-testdb:5432/agent_test
    services:
      agent-testdb:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: agent_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-09-12)
        with:
          toolchain: "1.98.1" # Match rust-toolchain.toml; floating stable can drift.
          components: clippy
      # Per-job dependency cache: the key includes the job id (no
      # shared-key), so this job keeps its own entry; saved on pushes only.
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo clippy -p two-bot-core --all-targets --features db --locked -- -D warnings
      - run: cargo test -p two-bot-core --features db --test feeds --locked
      - run: cargo test -p two-bot-core --features db --test feeds_store --locked -- --ignored

  tickets-postgres:
    name: tickets postgres
    permissions:
      contents: read
    needs: [job-inputs]
    # Skip when the selector sees no Rust inputs (not a required check).
    if: needs.job-inputs.outputs.rust != 'false'
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'tickets-postgres') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 15
    # Service DNS stays inside this job's network; never publish a shared port.
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    services:
      agent-testdb:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: agent_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TICKET_TEST_DB_HOST: agent-testdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-09-12)
        with:
          toolchain: "1.98.1" # Match rust-toolchain.toml; floating stable can drift.
      # TOG-11810: dependency build cache, as in the `check` job. The key
      # includes the job id, so this job keeps its own entry (it builds a
      # different dependency set); saved only on pushes to main.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo
          save-if: ${{ github.event_name == 'push' }}
      - name: Ticket lifecycle and migration integration tests
        run: cargo test -p two-bot-cutover --locked --test tickets_store -- --ignored
      - name: Ticket shared router and mock Discord lifecycle acceptance
        run: >-
          cargo test -p two-bot --locked --bin two-bot ticket_runtime:: -- --include-ignored

  worker:
    name: worker check
    permissions:
      contents: read
    needs: [job-inputs]
    # Required check: always runs so the merge gate never goes missing.
    # Docs/asset-only PRs fast-pass below (no `paths:` filter: that would
    # skip the whole workflow including this required check). A failed or
    # missing selector fails closed via the guard step, never a false green.
    if: ${{ always() }}
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'worker') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wrangler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Docs/asset-only fast pass (no worker inputs changed)
        if: needs.job-inputs.outputs.worker == 'false'
        run: echo "No worker inputs changed per the job-inputs selector; required check passes without the npm suite."
      # A skipped or failed selector must not make this required check green.
      - name: require job inputs selection to pass
        if: needs.job-inputs.result != 'success'
        run: exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.job-inputs.outputs.worker != 'false'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wrangler/package-lock.json
      - run: npm ci
        if: needs.job-inputs.outputs.worker != 'false'
      - run: npm run typecheck
        if: needs.job-inputs.outputs.worker != 'false'
      - run: npm test
        if: needs.job-inputs.outputs.worker != 'false'
      # TOG-9907: named envs do not inherit bindings; fail if any [env.*]
      # omits the Container/DO/exports/vars wiring (staging HTTP 1101).
      - name: check env bindings are explicit
        if: needs.job-inputs.outputs.worker != 'false'
        run: |
          python3 scripts/check-env-bindings.py wrangler.toml
          python3 scripts/test-env-bindings.py
      - name: Verify frozen legacy registry export preconditions
        if: needs.job-inputs.outputs.worker != 'false'
        run: node --test ../scripts/test-export-legacy-registry.mjs
      - name: Verify PR lint event and dispatch paths
        if: needs.job-inputs.outputs.worker != 'false'
        run: python3 ../scripts/test-pr-lint.py
      - name: Verify secret-scan trigger and concurrency surface
        if: needs.job-inputs.outputs.worker != 'false'
        run: python3 ../scripts/test-secret-scan.py
      - name: Verify production deploy guards
        if: needs.job-inputs.outputs.worker != 'false'
        run: python3 ../scripts/test-deploy-production.py
      - name: Verify release reconciliation retries
        if: needs.job-inputs.outputs.worker != 'false'
        run: python3 ../scripts/test-release-retry.py
      # Always runs, even on docs/asset-only fast-pass: the offline suite
      # pins this step with no `if:` (test_required_worker_ci_runs_this_offline_suite).
      - name: Verify staging rollout provenance (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_rollout.py -v
      - name: Verify staging rollback drill (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_rollback_drill.py -v
      - name: Verify staging container backout/restore drill (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_container_drill.py -v
      - name: Verify staging ownership-takeover retry (offline fixtures)
        run: node --test scripts/test-ownership-control.mjs
      - name: Verify staging redirect smoke (offline fixtures)
        if: needs.job-inputs.outputs.worker != 'false'
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_redirect_smoke.py -v
      - name: Verify staging automation read smoke (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_automation_read_smoke.py -v
      - name: Verify staging voice smoke (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_voice_smoke.py -v
      - name: Verify staging health-contract probe (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_health_contract_probe.py -v
      - name: Verify voice denied-copy fixtures (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_voice_denied_copy.py -v
      - name: Verify staging-guild E2E prep skeleton (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_guild_e2e_prep.py -v
      - name: Verify staging smoke edge-case fixtures (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_edge_cases.py -v
      - name: Verify staging smoke run (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_smoke_run.py -v
      - name: Verify staging events read (offline fixtures, no database)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_events_read.py -v
      - name: Verify cutover acceptance probes (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_qa_cutover_probes.py -v
      - name: Verify runner routing for every workflow job
        if: needs.job-inputs.outputs.worker != 'false'
        run: python3 ../scripts/test-runner-routing.py
      - name: Verify offline release lifecycle
        if: needs.job-inputs.outputs.worker != 'false'
        # Match the library bundled by the pinned release action, in an isolated
        # API-double fixture with lifecycle scripts disabled and no write token.
        run: | # zizmor: ignore[adhoc-packages] pinned offline release fixture only
          npm install --prefix "$RUNNER_TEMP/release-fixture" --ignore-scripts --no-audit --no-fund release-please@17.6.0
          NODE_PATH="$RUNNER_TEMP/release-fixture/node_modules" node ../scripts/test-release.cjs
          NODE_PATH="$RUNNER_TEMP/release-fixture/node_modules" node ../scripts/test-release-publication.cjs
          NODE_PATH="$RUNNER_TEMP/release-fixture/node_modules" node ../scripts/test-commit-parse-guard.cjs

  # Single always-run aggregator for the path-filtered matrix. GitHub counts
  # a skipped job as passing and leaves a required context pending when its
  # workflow never starts. `always()` ensures a verdict even when a needed
  # job fails or is cancelled. A broken selector cannot turn skips green:
  # `skipped` is accepted only when selection explicitly deselected that job.
  # Both selectors and lint are always-run gates. Container smoke remains
  # independently visible, with its exemption documented on that job.
  # Main's rules require `ci-ok`, `pr-lint` and `gitleaks`; there is no legacy
  # duplicate aggregate or ruleset transition left to perform.
  ci-ok:
    name: ci-ok
    permissions:
      contents: read
    needs: [job-inputs, container-inputs, supply-chain, check, rust-tests, ignored-db-stores, ignored-db-runtime, worker, parity-docs, self-role-store, community-db, feeds-db, tickets-postgres, moderation-db]
    # A skipped or cancelled dependency must not read as green.
    if: ${{ always() }}
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'ci-ok') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      - name: Aggregate CI verdict
        env:
          JOB_INPUTS_RESULT: ${{ needs.job-inputs.result }}
          CONTAINER_INPUTS_RESULT: ${{ needs.container-inputs.result }}
          RUST_SELECTED: ${{ needs.job-inputs.outputs.rust }}
          WORKER_SELECTED: ${{ needs.job-inputs.outputs.worker }}
          PARITY_SELECTED: ${{ needs.job-inputs.outputs.parity }}
          SUPPLY_SELECTED: ${{ needs.job-inputs.outputs.supply }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          IGNORED_DB_STORES_RESULT: ${{ needs.ignored-db-stores.result }}
          IGNORED_DB_RUNTIME_RESULT: ${{ needs.ignored-db-runtime.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
          PARITY_DOCS_RESULT: ${{ needs.parity-docs.result }}
          SELF_ROLE_RESULT: ${{ needs.self-role-store.result }}
          COMMUNITY_DB_RESULT: ${{ needs.community-db.result }}
          FEEDS_DB_RESULT: ${{ needs.feeds-db.result }}
          TICKETS_RESULT: ${{ needs.tickets-postgres.result }}
          MODERATION_DB_RESULT: ${{ needs.moderation-db.result }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          failures = []

          def selected(name):
              # The selector shell defaults undecidable diffs to true and the
              # outputs fall back to true, so a missing output with a
              # successful selector is treated as selected (fail-closed).
              return os.environ.get(name, "") != "false"

          if os.environ.get("JOB_INPUTS_RESULT") != "success":
              failures.append(
                  "job-inputs did not succeed "
                  f"(result={os.environ.get('JOB_INPUTS_RESULT')!r}); "
                  "refusing to trust skips")
          else:
              gated = [
                  ("worker", "WORKER_RESULT", "WORKER_SELECTED"),
                  ("parity-docs", "PARITY_DOCS_RESULT", "PARITY_SELECTED"),
                  ("supply-chain", "SUPPLY_CHAIN_RESULT", "SUPPLY_SELECTED"),
                  ("self-role-store", "SELF_ROLE_RESULT", "RUST_SELECTED"),
                  ("community-db", "COMMUNITY_DB_RESULT", "RUST_SELECTED"),
                  ("feeds-db", "FEEDS_DB_RESULT", "RUST_SELECTED"),
                  ("tickets-postgres", "TICKETS_RESULT", "RUST_SELECTED"),
                  ("moderation-db", "MODERATION_DB_RESULT", "RUST_SELECTED"),
                  ("rust-tests", "RUST_TESTS_RESULT", "RUST_SELECTED"),
                  ("ignored-db-stores", "IGNORED_DB_STORES_RESULT", "RUST_SELECTED"),
                  ("ignored-db-runtime", "IGNORED_DB_RUNTIME_RESULT", "RUST_SELECTED"),
              ]
              for job, result_var, sel_var in gated:
                  result = os.environ.get(result_var, "")
                  if result == "success":
                      continue
                  if result == "skipped" and not selected(sel_var):
                      continue
                  failures.append(f"{job}: result={result!r} selected={selected(sel_var)}")
              for job, var in (("check", "CHECK_RESULT"),
                               ("container-inputs", "CONTAINER_INPUTS_RESULT")):
                  result = os.environ.get(var, "")
                  if result != "success":
                      failures.append(f"{job}: result={result!r} (always-run gate)")

          if failures:
              print("ci-ok FAILED:")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)
          print("ci-ok passed")
          PY

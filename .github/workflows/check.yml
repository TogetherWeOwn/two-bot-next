          import os
          import subprocess

          if any(name.startswith('PG') for name in os.environ):
              raise SystemExit('unset ambient libpq PG* configuration before probing the test service')
          expected = {
              'data_directory': '/var/lib/postgresql/18/docker',
              'fsync': 'on',
              'full_page_writes': 'on',
              'synchronous_commit': 'on',
          }
          fields = ', '.join(f"'{key}', current_setting('{key}')" for key in expected)
          settings = json.loads(subprocess.check_output([
              'psql', 'postgres://agent_test:@agent-testdb:5432/two_bot_test_ci',
              '-X', '-w', '-At', '-v', 'ON_ERROR_STOP=1',
              '-c', f'SELECT json_build_object({fields})',
          ], text=True, env=os.environ | {
              'PGPASSFILE': '/dev/null', 'PGSSLMODE': 'disable',
              'PGOPTIONS': '-c statement_timeout=5000',
          }))
          if settings != expected:
              raise SystemExit('disposable Postgres data path or durability defaults changed')
          print('Disposable Postgres defaults:', json.dumps(settings, sort_keys=True))
          PY

      - name: Backup publication faults (actual CLI, dedicated CI service database)
        env:
          TWO_BOT_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_next_backup_publication_ci
          TWO_BOT_TEST_BACKUP_BIN: ${{ github.workspace }}/target/debug/two-bot
          PAPERCLIP_RUN_SCRATCH_DIR: ${{ runner.temp }}/two-bot-publication-tests
        run: |
          cargo build -p two-bot --locked
          cargo test -p two-bot-core --features db --locked --test backup_dump_publication -- --nocapture

      - name: Native v3 and real backup CLI regressions (CI service only)
        run: |
          export PAPERCLIP_RUN_SCRATCH_DIR
          PAPERCLIP_RUN_SCRATCH_DIR=$(mktemp -d "$RUNNER_TEMP/backup-regressions.XXXXXX")
          db="two_next_backup_publication_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          createdb -h agent-testdb -U agent_test "$db"
          trap 'dropdb -h agent-testdb -U agent_test --if-exists "$db"; rm -rf "$PAPERCLIP_RUN_SCRATCH_DIR"' EXIT
          export TWO_BOT_TEST_DATABASE_URL="postgres://agent_test:@agent-testdb:5432/$db"
          cargo build -p two-bot --locked
          export TWO_BOT_TEST_BACKUP_BIN="$PWD/target/debug/two-bot"
          cargo test -p two-bot-core --features db --test backup_roundtrip --test backup_dump_publication --locked -- --nocapture --test-threads=1
          # The shipped monthly drill on the complete migrated schema (TOG-11804).

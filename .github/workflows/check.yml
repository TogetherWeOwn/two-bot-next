        run: node ../scripts/test-daily-digest.cjs
      - name: Verify the production digest resolver (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_digest_resolve.py -v
      - name: Verify digest failure, repair and SBOM replay (offline fixtures)

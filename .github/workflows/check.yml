        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_events_read_acceptance.py -v
      - name: Verify staging privacy verify read (offline fixtures, no database)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_staging_privacy_verify_read.py -v
      - name: Verify cutover acceptance probes (offline fixtures)

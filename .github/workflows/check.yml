      - run: cargo clippy -p two-bot-core --all-targets --features db --locked -- -D warnings
      - run: cargo test -p two-bot-core --features db --test feeds --locked
      - run: cargo test -p two-bot-core --features db --test feeds_store --locked -- --ignored
      - run: cargo test -p two-bot-core --features db --test stream_live_store --locked -- --ignored

  tickets-postgres:
    name: tickets postgres
    permissions:
      contents: read
    needs: [job-inputs]
    # Skip when the selector sees no Rust inputs (not a required check).
    if: needs.job-inputs.outputs.rust != 'false'
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'tickets-postgres') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 15
    # Service DNS stays inside this job's network; never publish a shared port.
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    services:
      agent-testdb:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: agent_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TICKET_TEST_DB_HOST: agent-testdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-09-12)
        with:
          toolchain: "1.98.1" # Match rust-toolchain.toml; floating stable can drift.
        # Continue so the retry below can reinstall the same pin; it fails closed.
        continue-on-error: true

      # Retry the exact pin on a transient network failure; fails closed if it stays missing.
      - name: Retry Rust toolchain install on transient network failure
        if: steps.toolchain.outcome == 'failure'
        # Container steps default to sh, where pipefail aborts before any retry.
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: 1
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if rustup toolchain install "1.98.1" --profile minimal --no-self-update --force-non-host; then
              rustup default "1.98.1" --force-non-host
              exit 0
            fi
            [ "$attempt" -lt 5 ] || exit 1
            sleep $((attempt * 15))
          done

      # TOG-11810: dependency build cache, as in the `check` job. The key
      # includes the job id, so this job keeps its own entry (it builds a
      # different dependency set); saved only on pushes to main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ runner.os }}-cargo
          save-if: ${{ github.event_name == 'push' }}
      # The non-ignored creation-receipt acceptance modules require the
      # guarded disposable bootstrap, as in rust-tests; TestDb suites
      # connect to agent_test directly and ignore this variable. The
      # rust:bookworm job container ships no PostgreSQL client, so
      # install it first as in the community-db lane.
      - name: Prepare guarded test database
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
          rm -rf /var/lib/apt/lists/*
          createdb -h agent-testdb -U agent_test two_bot_test_ci
      - name: Generate command reference before ticket test compilation
        run: python3 scripts/generate_command_reference.py

      - name: Ticket lifecycle and migration integration tests
        run: cargo test -p two-bot-cutover --locked --test tickets_store -- --ignored
      - name: Ticket shared router and mock Discord lifecycle acceptance
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_ci
        # The ticket skip/budget log-assertion modules assert exact counts via
        # first-match on the process-wide tracing capture; they run serially
        # in the isolated step below, so skip them here where the revision
        # tests emit the same messages concurrently.
        run: >-
          cargo test -p two-bot --locked --bin two-bot ticket_runtime:: -- --include-ignored --skip ticket_runtime::cursor_budget
      # Same serial isolation as the check job: the skip/budget modules share
      # one process-wide capture with the revision tests above, so they run
      # alone with --test-threads=1 in a fresh process.
      - name: cargo test (isolated ticket skip/budget log assertions)
        run: cargo test -p two-bot --locked --bin two-bot ticket_runtime::cursor_budget -- --test-threads=1

  fuzz-compile:
    name: fuzz compile
    permissions:
      contents: read
    needs: [job-inputs]
    # Skip when the selector sees no Rust inputs (docs-only, worker-UI-only PRs);
    # `ci-ok` only accepts the skip when the selector deselected the job.
    if: needs.job-inputs.outputs.rust != 'false'
    # Runner routing: see the note on `check`.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'fuzz-compile') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 30
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 'line-tables-only'
      CARGO_PROFILE_TEST_DEBUG: 'line-tables-only'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_TEST_INCREMENTAL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-09-12)
        with:
          toolchain: "nightly-2026-10-01" # Pinned nightly for libFuzzer; stable pin stays in rust-toolchain.toml.
          components: rust-src
      # Per-job dependency cache: the key includes the job id (no
      # shared-key), so this job keeps its own entry; saved on pushes only.
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ runner.os }}-cargo
          save-if: ${{ github.event_name == 'push' }}
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Pinned dependencies: the committed fuzz/Cargo.lock (seeded from the
      # root lockfile) is this gate's version inventory. `--locked` fails the
      # required job instead of silently resolving fresh crates.io versions.
      - name: Fetch pinned fuzz dependencies (locked)
        working-directory: fuzz
        run: cargo +nightly-2026-10-01 fetch --locked
      # Builds all twenty-five libFuzzer targets. No campaign or generated corpus
      # output; the per-PR seed replay below covers the bounded eventsub_delivery,
      # helix_token, custom_command_template, fb_page_events, database_url,
      # feeds_http, self_role_custom_id, and helix_subscription_listing seeds.
      # Bounded vote_kick and helix_token smokes are manual (README).
      # The `+nightly-2026-10-01` selector is load-bearing: rustup resolves the
      # toolchain from the repo-root rust-toolchain.toml (stable 1.98.1) even
      # with working-directory fuzz/, so a bare `cargo fuzz build` runs under
      # stable and fails on `-Zsanitizer`. The `+toolchain` form bypasses it.
      - name: Compile-only fuzz build (no execution)
        working-directory: fuzz
        run: cargo +nightly-2026-10-01 fuzz build
      # Bounded seed replay, eventsub_delivery, helix_token,
      # custom_command_template, fb_page_events, database_url, feeds_http,
      # self_role_custom_id, and helix_subscription_listing: `-runs=0`
      # executes each committed corpus seed exactly once (plus the target's
      # fixed matrix) and exits without fuzzing. A signing-key drift between
      # the harness and production, a token-contract drift between the
      # helix_token oracle and the parser, a template-contract drift between
      # the custom_command_template oracle and the renderer, a
      # challenge/envelope-contract drift between the fb_page_events oracles
      # and the front door, a database-URL-contract drift between the
      # database_url oracle and the guard, an SSRF/redirect/content-type
      # drift between the feeds_http oracle and the validators, a
      # custom-id-namespace drift between the self_role_custom_id oracle and
      # the parser, a subscription-listing drift between the
      # helix_subscription_listing oracle and the envelope validator, or seed
      # misrouting panics an assertion here instead of passing a
      # compile-only gate. Compile stays the only gate for the other
      # seventeen targets.
      - name: Seed replay for eventsub_delivery (bounded, no campaign)
        working-directory: fuzz
        run: cargo +nightly-2026-10-01 fuzz run eventsub_delivery -- -runs=0 -timeout=10 -rss_limit_mb=2048
      - name: Seed replay for helix_token (bounded, no campaign)
        working-directory: fuzz
        run: cargo +nightly-2026-10-01 fuzz run helix_token -- -runs=0 -timeout=10 -rss_limit_mb=2048
      - name: Seed replay for custom_command_template (bounded, no campaign)
        working-directory: fuzz
        run: cargo +nightly-2026-10-01 fuzz run custom_command_template -- -runs=0 -timeout=10 -rss_limit_mb=2048
      - name: Seed replay for fb_page_events (bounded, no campaign)
        working-directory: fuzz
        run: cargo +nightly-2026-10-01 fuzz run fb_page_events -- -runs=0 -timeout=10 -rss_limit_mb=2048
      - name: Seed replay for database_url (bounded, no campaign)
        working-directory: fuzz
        run: cargo +nightly-2026-10-01 fuzz run database_url -- -runs=0 -timeout=10 -rss_limit_mb=2048
      - name: Seed replay for feeds_http (bounded, no campaign)
        working-directory: fuzz
        run: cargo +nightly-2026-10-01 fuzz run feeds_http -- -runs=0 -timeout=10 -rss_limit_mb=2048
      - name: Seed replay for self_role_custom_id (bounded, no campaign)
        working-directory: fuzz
        run: cargo +nightly-2026-10-01 fuzz run self_role_custom_id -- -runs=0 -timeout=10 -rss_limit_mb=2048
      - name: Seed replay for helix_subscription_listing (bounded, no campaign)
        working-directory: fuzz
        run: cargo +nightly-2026-10-01 fuzz run helix_subscription_listing -- -runs=0 -timeout=10 -rss_limit_mb=2048

  worker:
    name: worker check
    permissions:
      contents: read
    needs: [job-inputs]
    # Required check: always runs so the merge gate never goes missing.
    # Docs/asset-only PRs fast-pass below (no `paths:` filter: that would
    # skip the whole workflow including this required check). A failed or
    # missing selector fails closed via the guard step, never a false green.
    if: ${{ always() }}
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'worker') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wrangler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Docs/asset-only fast pass (no worker inputs changed)
        if: needs.job-inputs.outputs.worker == 'false'
        run: echo "No worker inputs changed per the job-inputs selector; required check passes without the npm suite."
      # A skipped or failed selector must not make this required check green.
      - name: require job inputs selection to pass
        if: needs.job-inputs.result != 'success'
        run: exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

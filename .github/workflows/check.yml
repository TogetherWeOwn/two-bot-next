name: staging-recovery-disposable-fixture
on: workflow_dispatch
permissions: {}
jobs:
  fixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    services:
      agent-testdb:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: two_bot_test_local
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind disposable service alias
        run: printf '127.0.0.1 agent-testdb\n' | sudo tee -a /etc/hosts > /dev/null
      - name: Fetch the comparison query
        run: git fetch --no-tags --depth=1 origin 81bd7999086c3790852031e7fcda4b63600b0ca2
      - name: Exercise the recovery inventory
        run: python3 scripts/ci/staging_recovery_catalog_fixture.py

      - name: Verify the missing-digest alert (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_digest_alert.py -v
      - name: Install pinned commit-parser fixture
        if: needs.job-inputs.outputs.worker != 'false'
        # The PR-side guard uses release-please's pinned conventional-commit
        # parser, in an isolated install with lifecycle scripts disabled.
        run: | # zizmor: ignore[adhoc-packages] pinned commit parser fixture only
          npm install --prefix "$RUNNER_TEMP/release-fixture" --ignore-scripts --no-audit --no-fund release-please@17.6.0
      - name: Verify the commit-parse guard
        if: needs.job-inputs.outputs.worker != 'false'
        run: NODE_PATH="$RUNNER_TEMP/release-fixture/node_modules" node ../scripts/test-commit-parse-guard.cjs

  # Single always-run aggregator for the path-filtered matrix. GitHub counts
  # a skipped job as passing and leaves a required context pending when its
  # workflow never starts. `always()` ensures a verdict even when a needed
  # job fails or is cancelled. A broken selector cannot turn skips green:
  # `skipped` is accepted only when selection explicitly deselected that job.
  # Both selectors and lint are always-run gates. Container smoke remains
  # independently visible, with its exemption documented on that job.
  # Main's rules require `ci-ok`, `pr-lint` and `gitleaks`; there is no legacy
  # duplicate aggregate or ruleset transition left to perform.
  ci-ok:
    name: ci-ok
    permissions:
      contents: read
    needs: [job-inputs, container-inputs, supply-chain, check, test-partition-plan, rust-tests-partition, ignored-db-runtime-partition, rust-tests, coverage-plan, coverage-shard, patch-coverage, ignored-db-stores, ignored-db-runtime, worker, parity-docs, self-role-store, community-db, feeds-db, tickets-postgres, moderation-db, fuzz-compile, nextest]
    # A skipped or cancelled dependency must not read as green.
    if: ${{ always() }}
    # Runner routing: see the note on the first job above.
    runs-on: ${{ fromJSON((!github.event.repository.private && '["ubuntu-latest"]') || (contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'ci-ok') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      - name: Aggregate CI verdict
        env:
          JOB_INPUTS_RESULT: ${{ needs.job-inputs.result }}
          CONTAINER_INPUTS_RESULT: ${{ needs.container-inputs.result }}
          RUST_SELECTED: ${{ needs.job-inputs.outputs.rust }}
          WORKER_SELECTED: ${{ needs.job-inputs.outputs.worker }}
          PARITY_SELECTED: ${{ needs.job-inputs.outputs.parity }}
          SUPPLY_SELECTED: ${{ needs.job-inputs.outputs.supply }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          TEST_PARTITION_PLAN_RESULT: ${{ needs.test-partition-plan.result }}
          RUST_TEST_PARTITION_RESULT: ${{ needs.rust-tests-partition.result }}
          RUNTIME_PARTITION_RESULT: ${{ needs.ignored-db-runtime-partition.result }}
          COVERAGE_PLAN_RESULT: ${{ needs.coverage-plan.result }}
          COVERAGE_SHARD_RESULT: ${{ needs.coverage-shard.result }}
          PATCH_COVERAGE_RESULT: ${{ needs.patch-coverage.result }}
          IGNORED_DB_STORES_RESULT: ${{ needs.ignored-db-stores.result }}
          IGNORED_DB_RUNTIME_RESULT: ${{ needs.ignored-db-runtime.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
          PARITY_DOCS_RESULT: ${{ needs.parity-docs.result }}
          SELF_ROLE_RESULT: ${{ needs.self-role-store.result }}
          COMMUNITY_DB_RESULT: ${{ needs.community-db.result }}
          FEEDS_DB_RESULT: ${{ needs.feeds-db.result }}
          TICKETS_RESULT: ${{ needs.tickets-postgres.result }}
          MODERATION_DB_RESULT: ${{ needs.moderation-db.result }}
          FUZZ_COMPILE_RESULT: ${{ needs.fuzz-compile.result }}
          NEXTEST_RESULT: ${{ needs.nextest.result }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          failures = []

          def selected(name):
              # The selector shell defaults undecidable diffs to true and the
              # outputs fall back to true, so a missing output with a
              # successful selector is treated as selected (fail-closed).
              return os.environ.get(name, "") != "false"

          if os.environ.get("JOB_INPUTS_RESULT") != "success":
              failures.append(
                  "job-inputs did not succeed "
                  f"(result={os.environ.get('JOB_INPUTS_RESULT')!r}); "
                  "refusing to trust skips")
          else:
              gated = [
                  ("worker", "WORKER_RESULT", "WORKER_SELECTED"),
                  ("parity-docs", "PARITY_DOCS_RESULT", "PARITY_SELECTED"),
                  ("supply-chain", "SUPPLY_CHAIN_RESULT", "SUPPLY_SELECTED"),
                  ("self-role-store", "SELF_ROLE_RESULT", "RUST_SELECTED"),
                  ("community-db", "COMMUNITY_DB_RESULT", "RUST_SELECTED"),
                  ("feeds-db", "FEEDS_DB_RESULT", "RUST_SELECTED"),
                  ("tickets-postgres", "TICKETS_RESULT", "RUST_SELECTED"),
                  ("moderation-db", "MODERATION_DB_RESULT", "RUST_SELECTED"),
                  ("rust-tests", "RUST_TESTS_RESULT", "RUST_SELECTED"),
                  ("test-partition-plan", "TEST_PARTITION_PLAN_RESULT", "RUST_SELECTED"),
                  ("rust-tests-partition", "RUST_TEST_PARTITION_RESULT", "RUST_SELECTED"),
                  ("ignored-db-runtime-partition", "RUNTIME_PARTITION_RESULT", "RUST_SELECTED"),
                  ("coverage-plan", "COVERAGE_PLAN_RESULT", "RUST_SELECTED"),
                  ("coverage-shard", "COVERAGE_SHARD_RESULT", "RUST_SELECTED"),
                  ("patch-coverage", "PATCH_COVERAGE_RESULT", "RUST_SELECTED"),
                  ("ignored-db-stores", "IGNORED_DB_STORES_RESULT", "RUST_SELECTED"),
                  ("ignored-db-runtime", "IGNORED_DB_RUNTIME_RESULT", "RUST_SELECTED"),
                  ("fuzz-compile", "FUZZ_COMPILE_RESULT", "RUST_SELECTED"),
                  ("nextest", "NEXTEST_RESULT", "RUST_SELECTED"),
              ]
              for job, result_var, sel_var in gated:
                  result = os.environ.get(result_var, "")
                  if result == "success":
                      continue
                  if result == "skipped" and not selected(sel_var):
                      continue
                  failures.append(f"{job}: result={result!r} selected={selected(sel_var)}")
              for job, var in (("check", "CHECK_RESULT"),
                               ("container-inputs", "CONTAINER_INPUTS_RESULT")):
                  result = os.environ.get(var, "")
                  if result != "success":
                      failures.append(f"{job}: result={result!r} (always-run gate)")

          if failures:
              print("ci-ok FAILED:")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)
          print("ci-ok passed")
          PY

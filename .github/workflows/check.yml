    env:
      TWO_TEST_DATABASE_URL: postgres://agent_test@agent-testdb:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.98.1" # Match rust-toolchain.toml; floating stable can drift.
          components: clippy
      # Per-job dependency cache: the key includes the job id (no
      # shared-key), so this job keeps its own entry; saved on pushes only.
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo
          save-if: ${{ github.event_name == 'push' }}
      - name: Check feature-gated community stores
        run: cargo clippy -p two-bot-core --all-targets --features db --locked -- -D warnings
      - name: Test presence, scorecard and inactivity ledgers on ephemeral Postgres
        run: |
          cargo test -p two-bot-core --features db --locked --lib community_store

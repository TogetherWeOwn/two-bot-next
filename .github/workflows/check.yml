            sleep $((attempt * 15))
          done

      # Per-job dependency cache: the key includes the job id (no
      # shared-key), so this job keeps its own entry; saved on pushes only.
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

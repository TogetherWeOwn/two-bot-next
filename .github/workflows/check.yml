        id: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98.1" # Match rust-toolchain.toml; floating stable can drift.
          components: clippy
        # Continue so the retry below can reinstall the same pin; it fails closed.
        continue-on-error: true

      # Retry the exact pin on a transient network failure; fails closed if it stays missing.
      - name: Retry Rust toolchain install on transient network failure
        if: steps.toolchain.outcome == 'failure'
        # Container steps default to sh, where pipefail aborts before any retry.
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: 1

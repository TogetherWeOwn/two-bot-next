      - name: Verify cutover freeze drill (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_cutover_freeze_drill.py -v
      - name: Verify rollback readiness probe (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_rollback_readiness_probe.py -v
      - name: Verify cutover watch checkpoint (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_cutover_watch_checkpoint.py -v
      - name: Verify cutover watch checkpoint origin admission (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_cutover_watch_checkpoint_origin_acceptance.py -v
      - name: Verify cutover watch checkpoint structured receipt (offline fixtures)
        run: PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test_cutover_watch_checkpoint_receipt_acceptance.py -v
      - name: Verify runner routing for every workflow job
        if: needs.job-inputs.outputs.worker != 'false'
        run: python3 ../scripts/test-runner-routing.py
      - name: Verify commit-parser step attribution (offline fixtures)
        if: needs.job-inputs.outputs.worker != 'false'
        run: python3 ../scripts/test-commit-parse-guard-ci.py
      - name: Verify the daily digest release (offline fixtures)
        if: needs.job-inputs.outputs.worker != 'false'
        # Digest tags, notes, quiet-day and rollback skips, off-main refusal
        # and the 200-commit ENOBUFS regression against a throwaway git

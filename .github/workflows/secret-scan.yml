name: secret-scan

# Full-history gitleaks scan; required check on main. Uses the gitleaks binary
# (the gitleaks-action wrapper needs a paid licence for organizations).
# --redact so findings never print the value. A secret that reaches a branch is
# already leaked: report it, do not just delete the line.

on:
  pull_request:
  push:
    branches: [main]
  # Dispatched by the release workflow (TOG-10035) on release-please branches:
  # PRs opened with GITHUB_TOKEN trigger no workflows, so the required
  # `gitleaks` check would never run on the release PR without this path.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # name pinned equal to the id: `gitleaks` is a required check.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history: a secret added and then removed in an earlier commit
          # on the same branch is still a leak, and a shallow clone hides it.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the full history
        run: |
          set -euo pipefail
          # --log-opts=HEAD: scan only history reachable from HEAD, not every fetched branch.
          gitleaks git . --redact --verbose --exit-code 1 --log-opts=HEAD

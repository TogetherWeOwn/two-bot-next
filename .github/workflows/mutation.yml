name: changed-line mutation (WARN)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}
concurrency:
  group: mutation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust-mutation:
    name: Rust changed-line mutation (WARN)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: rust:1.100-trixie@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8
    services:
      agent-testdb:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: two_bot_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        options: --health-cmd "pg_isready -U agent_test -d two_bot_test_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Install Python and the disposable Postgres client
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 postgresql-client >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan changed source lines
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .github/scripts/mutation_scope.py
          printf '%s\n' '{"status":"infrastructure_error","reason":"Rust setup or fixture did not complete","results":[]}' > "$RUNNER_TEMP/rust-mutation.json"
      - name: Install pinned cargo-mutants
        if: steps.plan.outputs.fixture == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/mutation-bin"
          archive="$RUNNER_TEMP/cargo-mutants.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 --output "$archive" \
            https://github.com/sourcefrog/cargo-mutants/releases/download/v27.1.0/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz
          printf 'dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e  %s\n' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/mutation-bin" cargo-mutants
          printf '%s\n' "$RUNNER_TEMP/mutation-bin" >>"$GITHUB_PATH"
      - name: Prove changed-line scope and verdicts with a tiny crate
        if: steps.plan.outputs.fixture == 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: python3 .github/scripts/mutation_rust_fixture.py
      - name: Measure Rust PR additions
        if: steps.plan.outputs.rust == 'true'
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_ci
          TWO_RSVP_RUNTIME_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_ci
          TWO_DATABASE_TLS: local-only
        run: |
          createdb -h agent-testdb -U agent_test agent_test
          python3 scripts/generate_command_reference.py
          python3 .github/scripts/mutation_rust.py --mode warn \
            --patch "$RUNNER_TEMP/mutation.diff" --report "$RUNNER_TEMP/rust-mutation.json"
      - name: Upload Rust verdicts
        if: ${{ always() && steps.plan.outputs.rust == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-mutation
          overwrite: true
          path: ${{ runner.temp }}/rust-mutation.json
          retention-days: 14
          if-no-files-found: error

  python-mutation:
    name: Python changed-line mutation (WARN)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Plan changed source lines
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/mutation_python_history.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.plan.outputs.python_fixture == 'true'
        with:
          python-version: '3.12.16'
      - name: Install the pinned Python suite dependency
        if: steps.plan.outputs.python_fixture == 'true'
        run: |
          printf '%s\n' 'PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc' > "$RUNNER_TEMP/mutation-requirements.txt"
          python3 -m pip --isolated install --only-binary=:all: --no-deps --require-hashes -r "$RUNNER_TEMP/mutation-requirements.txt"
      - name: Prove changed-line mutation with offline unittest fixtures
        if: steps.plan.outputs.python_fixture == 'true'
        run: python3 .github/scripts/mutation_python_fixture.py
      - name: Measure Python PR additions
        if: steps.plan.outputs.python == 'true'
        run: |
          python3 .github/scripts/mutation_python.py --mode warn \
            --patch "$RUNNER_TEMP/mutation.diff" --report "$RUNNER_TEMP/python-mutation.json"
      - name: Upload Python verdicts
        if: ${{ always() && steps.plan.outputs.python == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-mutation
          overwrite: true
          path: ${{ runner.temp }}/python-mutation.json
          retention-days: 14
          if-no-files-found: error

  worker-mutation:
    name: Worker changed-line mutation (WARN)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan changed source lines
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/mutation_scope.py
          printf '%s\n' '{"results":[{"status":"infrastructure_error","reason":"Worker setup or audit did not complete"}]}' > "$RUNNER_TEMP/worker-mutation.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.worker_fixture == 'true'
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Audit and install the locked TypeScript parser
        if: steps.plan.outputs.worker_fixture == 'true'
        working-directory: .github/mutation-worker
        run: |
          npm audit --audit-level=high
          npm ci --ignore-scripts --no-audit
      - name: Prove changed-line mutation with Worker fixtures
        if: steps.plan.outputs.worker_fixture == 'true'
        run: node .github/mutation-worker/fixture.mjs
      - name: Measure Worker PR additions
        if: steps.plan.outputs.worker == 'true'
        run: bash .github/mutation-worker/measure.sh
      - name: Upload Worker verdicts
        if: ${{ always() && steps.plan.outputs.worker == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-mutation
          overwrite: true
          path: ${{ runner.temp }}/worker-mutation.json
          retention-days: 14
          if-no-files-found: error

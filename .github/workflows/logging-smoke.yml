name: logging container smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logging-smoke-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  logging-smoke:
    name: logging container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify smoke parser rejects non-JSON output
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-logging-container.py --self-test
      - name: Build the actual runtime image
        run: docker build --tag two-bot-json-smoke .
      - name: Token-free JSON and shutdown smoke (no network)
        run: python3 scripts/test-logging-container.py two-bot-json-smoke

name: nightly

on:
  schedule:
    # Off the hour to avoid the busiest scheduled-run window (UTC).
    - cron: '17 3 * * *'
  workflow_dispatch:
  # Bootstrap a new workflow before it exists on main, and validate edits.
  # GitHub requires a default-branch workflow before workflow_dispatch works.
  pull_request:
    paths:
      - '.github/workflows/nightly.yml'

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: nightly advisories
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fetch current RustSec data even when Cargo.lock has not changed.
      # cargo-deny reads the lockfile; no token-writing/reporting steps.
      - name: cargo deny check advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories

  sweep:
    name: nightly ignored tests and docs
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 45
    # Match check.yml: no service ports on the shared Docker host.
    container:
      image: rust:bookworm@sha256:93ce27a88655056a51dbdd8f5f2d7ddc071c7b0070fb288a37b5a285fc83971e
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      TWO_LFG_TESTDB_CI: '1'
      TWO_LEVELING_TEST_CI: '1'
      TWO_GATEWAY_TEST_DATABASE_URL: postgresql://agent_test@localhost:5432/agent_test
    services:
      agent-testdb:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: agent_test
          POSTGRES_DB: agent_test
          # Disposable CI service only, matching the test-database guards.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09-12)
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keep lean nightly artifacts separate from the required check job.
          key: ${{ runner.os }}-nightly-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-nightly-cargo-
      - name: Prepare isolated test databases
        id: databases
        run: |
          # Match check.yml's job-private loopback for fixed-endpoint fixtures.
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client socat >/dev/null
          nohup setsid socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:agent-testdb:5432 >/dev/null 2>&1 &
          for i in $(seq 1 30); do pg_isready -q -h 127.0.0.1 -U agent_test -d agent_test && break; sleep 1; done
          pg_isready -q -h 127.0.0.1 -U agent_test -d agent_test
          createdb -h agent-testdb -U agent_test two_bot_test_tog10090_nightly
          createdb -h agent-testdb -U agent_test two_next_backup_nightly
          createdb -h agent-testdb -U agent_test two_next_backup_publication_nightly
          mkdir -p "$RUNNER_TEMP/backup-roundtrip" "$RUNNER_TEMP/backup-publication"
      # Serial execution prevents the ignored stores' shared tables/locks from
      # racing. Sticky/onboarding tests are disposable-DB tests, not Discord calls.
      # Channel moderation, feeds_store and legacy_verify_db require agent_test,
      # not the two_bot_test_* bootstrap used by TestDatabase suites. Skip only
      # those tests here, then run all guarded suites below with their accepted URL.
      # No ignored suite is permanently excluded.
      - name: Full workspace sweep including ignored tests
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_bot_test_tog10090_nightly
        run: >-
          cargo test --workspace --all-features --locked -- --include-ignored --test-threads=1
          --skip channel_moderation_store::
          --skip defer_precedes_sql_and_effect_then_edits_original_with_no_mentions
          --skip rejected_or_ambiguous_defer_never_claims_or_mutates
          --skip failed_result_edit_never_repeats_a_completed_effect
          --skip persistence_failure_edits_safe_reconciliation_reply_and_keeps_lane
          --skip disabled_command_uses_ephemeral_lifecycle_and_other_slices_are_untouched
          --skip shared_router_gates_bounds_and_required_reason_refuse_without_http
          --skip purge_and_slowmode_success_audit_and_replay_without_repeating_effects
          --skip repeated_lockdown_keeps_first_seed_and_unlock_restores_exact_masks
          --skip initially_absent_overwrite_is_deleted_only_after_recorded_lockdown
          --skip ambiguous_unlock_retains_recovery_and_both_claims_across_all_keys
          --skip rejected_first_lock_retires_only_its_seed_and_finishes_refusal
          --skip audit_failure_retries_only_finalization_not_a_successful_discord_effect
          --skip first_seed_and_durable_lane_exist_before_lock_put_is_accepted
          --skip exhausted_audit_failure_retains_lane_and_cannot_redo_successful_effect
          --skip stale_tickets_and_action_only_mismatch_never_admit_runtime_effects
          --skip feed_crud_audit_scope_and_timestamp_roundtrip
          --skip concurrent_claims_lease_takeover_and_stale_owner_fencing
          --skip mock_delivery_crash_reconciliation_restart_and_overflow
          --skip parity_mismatch_cursor_and_read_only_acceptance
      - name: Channel moderation ignored tests with their guarded URL
        if: ${{ !cancelled() && steps.databases.outcome == 'success' }}
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test@agent-testdb:5432/agent_test
        run: >-
          cargo test -p two-bot-core --all-features --lib --locked channel_moderation_store::
          -- --include-ignored --test-threads=1
      - name: Channel moderation runtime acceptance with its guarded URL
        if: ${{ !cancelled() && steps.databases.outcome == 'success' }}
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test@agent-testdb:5432/agent_test
        run: >-
          env -u PGPASSWORD -u PGPASSFILE -u PGOPTIONS cargo test -p two-bot-discord
          --all-features --test channel_moderation_runtime --locked
          -- --include-ignored --test-threads=1
      - name: Feed store ignored tests with their guarded URL
        if: ${{ !cancelled() && steps.databases.outcome == 'success' }}
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test@agent-testdb:5432/agent_test
        run: >-
          cargo test -p two-bot-core --all-features --test feeds_store --locked
          -- --include-ignored --test-threads=1
      - name: Legacy verification ignored tests with their guarded URL
        if: ${{ !cancelled() && steps.databases.outcome == 'success' }}
        env:
          TWO_TEST_DATABASE_URL: postgres://agent_test@agent-testdb:5432/agent_test
        run: >-
          cargo test -p two-bot-cutover --all-features --test legacy_verify_db --locked
          -- --include-ignored --test-threads=1
      # Backup integration tests are opt-in (not #[ignore]); the URL is unset in
      # the broad sweep because they rebuild tables and need dedicated databases.
      # Publication also needs the actual CLI binary and a writable scratch root.
      - name: Build backup CLI
        id: backup-cli
        if: ${{ !cancelled() && steps.databases.outcome == 'success' }}
        run: cargo build -p two-bot --bin two-bot --all-features --locked
      - name: Backup roundtrip on a dedicated disposable database
        if: ${{ !cancelled() && steps.databases.outcome == 'success' }}
        env:
          TWO_BOT_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_next_backup_nightly
          PAPERCLIP_RUN_SCRATCH_DIR: ${{ runner.temp }}/backup-roundtrip
        run: >-
          cargo test -p two-bot-core --all-features --test backup_roundtrip --locked
          -- --include-ignored --test-threads=1
      - name: Backup publication on a dedicated disposable database
        if: ${{ !cancelled() && steps.databases.outcome == 'success' && steps.backup-cli.outcome == 'success' }}
        env:
          TWO_BOT_TEST_DATABASE_URL: postgres://agent_test:@agent-testdb:5432/two_next_backup_publication_nightly
          TWO_BOT_TEST_BACKUP_BIN: ${{ github.workspace }}/target/debug/two-bot
          PAPERCLIP_RUN_SCRATCH_DIR: ${{ runner.temp }}/backup-publication
        run: >-
          cargo test -p two-bot-core --all-features --test backup_dump_publication --locked
          -- --include-ignored --test-threads=1
      - name: cargo doc -D warnings
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Report cache size
        if: always()
        shell: bash
        run: |
          for path in "$HOME/.cargo/registry" "$HOME/.cargo/git" "$GITHUB_WORKSPACE/target"; do
            if [ -d "$path" ]; then
              du -sh "$path"
            else
              printf '%s: absent\n' "$path"
            fi
          done
          df -h "$GITHUB_WORKSPACE"

id: refusal-fixed-vocabulary
language: python
severity: error
message: 'Refusal messages must stay fixed vocabulary: do not interpolate rejected keys, ports, URLs, values or response bytes into Refused/ReadFailed/require. Allowlisted fixed sites: ALL_CAPS constants, {label} call-site labels, the classify_failure sanitizer, type(...).__name__, "has a bad {key}" (allowlisted key names only), "plan refused the gate" (reviewed plan-binary exit relay), the require message relay, and the guild-fence SmokeError relay.'
files:
  - scripts/ci/staging_schema_gate.py
  - scripts/ci/production_schema_gate.py
  - scripts/staging_events_read.py
rule:
  all:
    - any:
        - pattern: Refused($MSG)
        - pattern: ReadFailed($MSG)
        - pattern: require($COND, $MSG)
    - regex: '(\{|\.format\s*\(|%\s*\w|str\s*\(|repr\s*\(|ascii\s*\(|\.join\s*\(|\+|Refused\(\s*[a-z_]|ReadFailed\(\s*[a-z_])'
  not:
    any:
      # Module constants (MEMBER_ENV, DB_ROLE, ...): fixed vocabulary by construction.
      - regex: '\{[A-Z][A-Z0-9_]*\}'
      # Call-site labels: parse_instant/verify_binding callers pass literals.
      - regex: '\{label\}'
      # classify_failure maps psql stderr to a fixed phrase; the raw bytes never reach the message.
      - regex: 'classify_failure\('
      # Exception class names are code, not input.
      - regex: 'type\([A-Za-z_][A-Za-z0-9_]*\)\.__name__'
      # Reached only after `if key not in URL_PARAMS` refuses, so key is one allowlisted name.
      - regex: 'has a bad \{key\}'
      # Reviewed plan-binary exit relay: exit code (int) plus the last stderr line.
      - regex: 'plan refused the gate'
      # guild_fence raises fixed-vocabulary SmokeError literals only (pinned by test).
      - regex: 'Refused\(str\(error\)\)'
      # The require(condition, message) helper relays its message argument;
      # the call sites are covered above, so the bare relay stays exempt.
      - regex: 'Refused\(\s*message\s*\)'

id: rust-inline-test-schema-allocation
language: Rust
severity: warning
message: Use two_bot_testsupport::create_test_schema for scratch schemas.
ignores:
- 'crates/testsupport/**'
- '**/tests/**/*.rs'
- '**/tests.rs'
- '**/test_*.rs'
- '**/*_test*.rs'
rule:
  any:
  - kind: string_literal
  - kind: raw_string_literal
  regex: '(?i)(?:\A(?:r#*)?"|;)(?:\s|\\[nrt]|\\\r?\n)*create(?:\s|\\[nrt]|\\\r?\n)+schema\b'
  inside:
    stopBy: end
    follows:
      kind: attribute_item
      regex: '^#\[\s*(?:cfg\s*\(\s*(?:test\s*\)|all\s*\(\s*(?:[^,()]+,\s*)*test\s*[,)])|(?:\w+::)*test\b)'
      stopBy:
        not:
          any:
          - kind: attribute_item
          - kind: line_comment
          - kind: block_comment

valid:
- '#[test] fn counter() { let metrics = Metrics::default(); run(&metrics); assert_eq!(metrics.count(), 1); }'
invalid:
- '#[test] fn counter() { let before = metrics::global().count(); run(); assert_eq!(metrics::global().count(), before + 1); }'
- '#[test] fn counter() { let before = two_bot_core::metrics::global().count(); }'

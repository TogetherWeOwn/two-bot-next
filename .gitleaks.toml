[extend]
useDefault = true

# Public synthetic snowflake in the legacy signing vector and its unit tests.
# Include the old source path because CI scans all reachable commits, including
# ebd7453's five test-only false positives. No real ID or crypto key is allowed.
[[allowlists]]
description = "internal-action test snowflake only (including historical fixtures)"
targetRules = ["discord-client-id"]
condition = "AND"
regexTarget = "secret"
paths = ['''^crates/core/src/internal_actions\.rs$''', '''^crates/core/tests/fixtures/internal-action-signing\.json$''']
regexes = ['''^123456789012345678$''']

# docs/lfg-port.md documents this public boolean test-container switch.
# Match only the literal identifier/value, never a path, commit, or rule.
[[allowlists]]
description = "Public LFG CI boolean switch, not an API credential"
regexTarget = "secret"
regexes = ['^TWO_LFG_TESTDB_CI=1$']

# This fixture was introduced by b27e06432dc6437fc3da5ca7b2219b3fec41765e.
# Merge this base policy before fix/mutation-429-proves-no-effect; remove it
# only when the full-history scan no longer reaches that introducing commit.
[[allowlists]]
description = "Historical synthetic member-moderation test idempotency fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
commits = ["b27e06432dc6437fc3da5ca7b2219b3fec41765e"]
paths = ['''^crates/core/src/member_moderation\.rs$''']
regexes = ['''^key-tempban-429$''']

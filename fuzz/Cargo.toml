[package]
name = "two-bot-next-fuzz"
version = "0.0.0"
edition = "2021"
license = "BUSL-1.1"
publish = false

[package.metadata]
cargo-fuzz = true

# Separate workspace: libFuzzer and nightly flags never enter the normal build.
[workspace]
members = ["."]
resolver = "2"

[dependencies]
hex = "0.4"
hmac = "0.13"
libfuzzer-sys = "=0.4.13"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
two-bot-core = { version = "0.4.0", path = "../crates/core", default-features = false } # x-release-please-version
two-bot-cutover = { version = "0.4.0", path = "../crates/cutover" } # x-release-please-version
two-bot = { version = "0.4.0", path = "../crates/bot" } # x-release-please-version
two-bot-discord = { version = "0.4.0", path = "../crates/discord", features = ["db"] } # x-release-please-version
url = "2.5.8"

[[bin]]
name = "internal_action"
path = "fuzz_targets/internal_action.rs"
test = false
doc = false
bench = false

[[bin]]
name = "automod"
path = "fuzz_targets/automod.rs"
